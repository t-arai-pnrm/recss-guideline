<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>第13章の課題：置かれた幅でカードの配置と見出しを変える</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <div class="sidebar" style="--sidebar--gap: calc(var(--spacing--md) * 1px)">
      <main class="main-column">
        <ul class="stack" style="--stack--gap: calc(var(--spacing--md) * 1px)">
          <li>
            <article class="scoped news-card">
              <div class="_header">
                <h2>サイトを公開しました</h2>
                <time datetime="2026-10-01">2026年10月1日</time>
              </div>
              <p>最初のお知らせです。</p>
            </article>
          </li>
          <li>
            <article class="scoped news-card">
              <div class="_header">
                <h2>営業時間を変更します</h2>
                <time datetime="2026-10-08">2026年10月8日</time>
              </div>
              <p>11月から、平日の営業時間を1時間延ばします。</p>
            </article>
          </li>
        </ul>
      </main>
      <aside class="side-column">
        <ul class="stack" style="--stack--gap: calc(var(--spacing--sm) * 1px); --news-card--padding: calc(var(--spacing--sm) * 1px)">
          <li>
            <article class="scoped news-card">
              <div class="_header">
                <h2>年末年始の休業</h2>
                <time datetime="2026-10-12">2026年10月12日</time>
              </div>
              <p>12月29日から1月3日まで休業します。</p>
            </article>
          </li>
          <li>
            <article class="scoped news-card">
              <div class="_header">
                <h2>採用情報を更新しました</h2>
                <time datetime="2026-10-14">2026年10月14日</time>
              </div>
              <p>デザイナーの募集を始めました。</p>
            </article>
          </li>
        </ul>
      </aside>
    </div>
  </body>
</html>
