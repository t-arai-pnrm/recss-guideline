# 第17章 インタラクション

# 17-1 ホバーとフォーカスを表す
- id: hover-operable-in-any-hover
  level: 必須
  kind: spec
  rule: 'ホバーのスタイルは、リンクなら `&:any-link:hover`、ボタンやフォームのコントロールなら `&:enabled:hover` のように操作できる状態に限定し、`@media (any-hover)` の中に書く。'
  reason: '`href` のない現在のページのリンクや無効にしたボタンが押せるかのように反応するのと、タッチ操作の端末でホバーの状態が残り続けるのを防ぎつつ、タブレットにマウスをつないだ場合のように、ホバーできる入力がひとつでもあればホバーを有効にできるため。'
  note: '条件は `(any-hover: hover)` と値まで書かず、`(any-hover)` と書きます。値なしの `(any-hover)` は、値が `none` のときだけ偽になるので、`(any-hover: hover)` と同じ意味です。`(hover: hover)` や画面の幅では判定しません。`<summary>` と `<label>` には無効の状態がないので、`:hover` に操作できる状態の条件を付けません。'
  aiProne: true
  page: interaction/states-and-focus
  since: 0.20.0

- id: hover-with-focus-visible
  level: 必須
  kind: judgment
  rule: ホバーで変える見た目は、`:focus-visible` にも同じように指定する。
  reason: キーボードで操作するユーザーにも同じ手がかりを示せ、フォーカスリングが見えにくい場面の補いにもなるため。
  aiProne: true
  page: interaction/states-and-focus
  since: 0.1.0

- id: no-motion-on-focus-visible
  level: 禁止
  kind: judgment
  rule: キーボードでフォーカスを受けた要素の見た目は、トランジションやアニメーションを掛けずに一度で切り替える。
  reason: 入力と表示の変化がずれて、反応が遅く感じられるため。
  note: 'トランジションは `&:not(:focus-visible)` の中に書き、`:focus-visible` のときは一度で切り替えます。フォーカスが離れて元の見た目に戻る変化は、`:not(:focus-visible)` のトランジションで動いてかまいません。'
  page: interaction/states-and-focus
  since: 0.1.0

- id: no-opacity-for-hover
  level: 非推奨
  kind: judgment
  rule: ホバーやフォーカスの変化を `opacity` で表さない。
  reason: 文字まで透けてコントラストが下がり、「なぜ透けるのか」という意図もコードから読み取れないため。
  note: '背景色や文字色を、トークンや相対カラー構文で作った別の色に変えます。背景が透明な項目（メニュー、リスト、タブ）には、半透明の重ね色のトークン `--background--hover` と `--background--active` を `background-color` に指定します。半透明なのは重ねた背景の色だけで、文字は透けないので、`opacity` で透かす方法とは違います。背景色のあるボタンは、相対カラー構文で明るさを変えます。文字色で塗るボタン（`--background--inverse`）は、テーマによって明るくするか暗くするかが逆になるので、`color-mix()` でページの背景色に寄せます。'
  aiProne: true
  page: interaction/states-and-focus
  since: 0.1.0

- id: hover-target-stays-still
  level: 推奨
  kind: spec
  rule: ホバーで位置や大きさが変わる要素は、ホバーを受ける要素を動かさず、子要素（または擬似要素）を動かす。
  reason: ホバーを受ける要素自身が動くと、カーソルが要素の外に出てホバーが外れ、戻るとまた当たるという繰り返しで、ちらつくため。
  note: 'ホバーを受ける要素の `&:any-link:hover`／`&:enabled:hover` と `&:focus-visible` で `--_hocus: --true` を立て、動かす子要素や擬似要素は `@container style(--_hocus: --true)` の中で動かします。'
  page: interaction/states-and-focus
  since: 0.4.0

- id: hover-keeps-size
  level: 推奨
  kind: spec
  rule: 'ホバーやフォーカスで、隣の要素を押すほど要素の大きさを変えない。文字を太くするときは、書体にグレード（`GRAD`）の軸があれば `font-variation-settings` の `GRAD` で濃くし、なければ太字の幅を先に確保する。'
  reason: 状態で要素の幅が広がると後ろの要素が押され、カーソルを動かすたびに並びが揺れるため。
  note: 'ラベルが和文だけなら、漢字と全角のかなは太さで字幅が変わらないので、`font-weight` を変えてかまいません。太字の幅は、リンクの文字と同じ文字を `data-label` 属性に持たせ、縦並びの `inline flex` にしたリンクの `::after` に `content: attr(data-label) / ""`、`visibility: hidden`、`block-size: 0`、太字を指定して確保します。状態で `border` を足すときは、同じ太さの透明な `border` を最初から置き、色だけを変えます。'
  page: interaction/states-and-focus
  since: 0.81.0

# 17-2 押せる範囲とタッチ操作
- id: hit-area-min-size
  level: 推奨
  kind: spec
  rule: '操作する要素には 24px 相当の最小の大きさを確保し、`@media (any-pointer: coarse)` では 44px 相当にする。大きさは内部のカスタムプロパティの値だけを切り替える。'
  reason: 指で操作する環境では、小さな操作領域が押し間違いの原因になり、値だけを切り替えれば `min-block-size` と `min-inline-size` の指定を1か所にできるため。
  note: 24px は WCAG 2.2 の達成基準 2.5.8（AA）、44px は 2.5.5（AAA）に由来します。周囲に十分な間隔がある場合や文章中のリンクは、2.5.8 の例外です。文字と一緒に大きくなるように `rem` で書き、`max(24px, 24 / 16 * 1rem)` のように CSS ピクセルの下限を併記します。
  page: interaction/hit-area-and-touch
  since: 0.4.0

- id: padding-on-interactive-element
  level: 推奨
  kind: spec
  rule: 押せる範囲を広げる `padding` は、`<li>` のような外側の要素ではなく、`<a>` や `<button>` のような操作する要素自身に付ける。チェックボックスやラジオボタンは `<label>` で文字と一緒に包む。
  reason: 外側の要素に付けた `padding` は見た目を大きくするだけで、押せる範囲は文字の部分に限られ、項目の端を押しても反応しないため。
  note: '`<a>` は `display: block flow` か `display: inline flow-root` にして、上下の `padding` も押せる範囲と行の高さに含めます。チェックボックスと `<label>` を兄弟に並べて間を空けると、その隙間は押しても何も起きない領域になります。'
  page: interaction/hit-area-and-touch
  since: 0.28.0

- id: no-gaps-between-hover-items
  level: 推奨
  kind: judgment
  rule: 'ホバーで背景が付く項目を並べるメニュー、リスト、タブでは、項目の間を `gap` や `margin` で空けず、間隔を各項目の内側の `padding` で作る。'
  reason: カーソルが項目の間の隙間を通るあいだはどの項目にもホバーが当たらず、背景が消えてから次の項目に付き直して点滅して見え、隙間を押しても何も起きないため。
  note: '背景の帯どうしを離して見せたいときも、項目は隙間なく並べ、背景を項目の擬似要素に描いて `inset` で内側に寄せます。カーソルに最も近い項目に背景を付ける作り方や、隙間のクリックを背景の付いた項目に渡す作り方は JavaScript が要るので、採りません。ホバーした項目へ背景が移る表現（`anchor-indicator-as-decoration`）でも、隙間では背景が薄れてから戻ります。'
  page: interaction/hit-area-and-touch
  since: 0.38.0

- id: pseudo-hit-area-no-overlap
  level: 推奨
  kind: spec
  rule: '見た目を変えずに押せる範囲を広げるときは、擬似要素を `inset: min(0px, (100% - var(--_hit-size)) / 2)` で要素の外にはみ出させ、広げた範囲を隣の操作する要素に重ねない。'
  reason: 擬似要素は要素の一部として押せるので見た目を保ったまま範囲を広げられるが、隣の要素に重なると、押した要素と違うものが反応することがあるため。
  note: 要素がもともと `--_hit-size` より大きいときは、`min()` の上限の0pxで擬似要素が要素より小さくならないようにしています。並べるときは、広げたあとの大きさで間隔を確かめます。
  page: interaction/hit-area-and-touch
  since: 0.28.0

- id: user-select-none-for-controls
  level: 推奨
  kind: judgment
  rule: '`user-select: none` は、`<label>` で作った切り替えや `role="tab"` のタブのように、連打や長押しで文字が選択されて困る操作部品にだけ指定し、本文や `body` には指定しない。'
  reason: '初期値の `auto` は親の値が `none` なら `none` として扱われるので、広い範囲に指定すると、文章のコピーや、選択した文字を読み上げや翻訳の機能に渡す操作ができなくなるため。'
  note: 'Safari は接頭辞なしの `user-select` に対応していないので、`-webkit-user-select` を、理由のコメントと Stylelint の無効化のコメントを添えて併記します。`<button>` の文字は、ダブルクリックしても選択されません（Chrome で確認）。'
  page: interaction/hit-area-and-touch
  since: 0.21.0

- id: no-global-touch-action-none
  level: 禁止
  kind: spec
  rule: '`html`、`body`、全称セレクタのようにページ全体に及ぶセレクタに `touch-action: none` を指定しない。'
  reason: 'ブラウザは触れた要素からスクロールする祖先までの `touch-action` を重ね合わせて許す操作を決めるので、ページ全体でスクロールとピンチでの拡大が止まるため。'
  note: '`touch-action` は、ドラッグやスワイプを自分で処理する部品にだけ、`pan-y pinch-zoom` のように残す操作を明示して指定します。ボタンなどの `touch-action: manipulation` は kiso.css が指定しているので、書き直しません。'
  page: interaction/hit-area-and-touch
  since: 0.21.0

# 17-3 状態を属性で表す
- id: state-by-pseudo-class-or-aria
  level: 推奨
  kind: judgment
  rule: 状態のスタイルは、`.is-active` のような状態クラスを使わず、擬似クラス（`:disabled` など）、HTML 要素の属性（`target` など）、ARIA 属性（`aria-expanded` など）、`data-*` 属性の優先順位でセレクタを選ぶ。
  reason: ブラウザの動作や支援技術に伝わる状態と同じ情報から見た目が決まるのでずれず、クラスと属性を二重に管理せずに済むため。
  note: '`:required` と `required` 属性のように、擬似クラスと属性のどちらでも選べる状態は、擬似クラスで選びます。'
  aiProne: true
  page: interaction/state-attributes
  since: 0.1.0

- id: data-attribute-for-other-states
  level: 推奨
  kind: convention
  rule: HTML の属性にも ARIA 属性にもない状態（スクロールで縮んだヘッダーや演出の進み具合など）だけを、`data-compact-mode` のような `data-*` 属性で表す。
  reason: 見た目のためだけの状態を、支援技術に伝わる意味と混ぜずに済むため。
  page: interaction/state-attributes
  since: 0.1.0

- id: focus-visible-over-focus-within
  level: 推奨
  kind: spec
  rule: ブラウザがフォーカスの表示を必要と判断する場合に限って親の見た目を変えるときは、`:focus-within` ではなく `&:has(:focus-visible)` を使う。
  reason: '`:focus-within` は、ボタンをマウスでクリックしたときのように、ブラウザがフォーカスリングを出さない場面にも当てはまるため。'
  note: '`:focus-visible` は入力の手段を判定しません。テキストの入力欄は、クリックでフォーカスしたときにも当てはまります。入力欄をクリックした時点でグループ全体を強調してよいなら、`:focus-within` で足ります。'
  page: interaction/state-attributes
  since: 0.4.0

# 17-4 カード全体をリンクにする
- id: stretched-link-for-card
  level: 推奨
  kind: judgment
  rule: カード全体をリンクにするときは、`<a>` でカードを包まず、見出しのリンクの `::after` をカードいっぱいに広げ、フォーカスリングはカードの `:has(:focus-visible)` に出す。
  reason: リンクのテキストが見出しだけになり、スクリーンリーダーでカードの中身をすべて読み上げるような冗長さを避けられるため。
  note: カードの中にほかのリンクやボタンを置くときは、それらを `::after` より手前に重ねます。
  page: interaction/card-link
  since: 0.1.0

# 17-5 要素を隠す方法を選ぶ
- id: hide-by-purpose
  level: 推奨
  kind: judgment
  rule: '読み上げさせたい要素は `.-visually-hidden` で見た目だけを消し、`display: none`（`hidden` 属性）と `visibility: hidden` は支援技術からも消したいときに使う。見た目を消したら、フォーカスと読み上げから外れているか（または残っているか）を、隠す目的と照らして確かめる。'
  reason: '`display: none` で隠したラベルは読み上げられず、`opacity: 0` や `clip-path` だけで隠したリンクは見えないままフォーカスと読み上げの対象に残り、どちらも見た目の確認だけでは気付けないため。'
  note: '見た目を残して支援技術からだけ消すときは `aria-hidden="true"`、操作とフォーカスまで止めるときは `inert` 属性を使います。`aria-hidden="true"` は、フォーカスできる要素とその祖先には付けません。`.-visually-hidden` を付けたリンクやボタンは、見えないままフォーカスを受けるので、スキップリンクのようにフォーカスの間だけ見せる要素には `.-visually-hidden-focusable` を使います。確かめるときは、キーボードで一巡し、開発者ツールでアクセシビリティツリーを見ます。'
  aiProne: true
  page: interaction/hiding-elements
  since: 0.56.0

# 17-6 開閉する UI
- id: native-disclosure-elements
  level: 推奨
  kind: judgment
  rule: 開閉する UI は、`<dialog>`、`popover` 属性、`<details>`、`hidden="until-found"` のような HTML の機能で作り、`div` とクラスの付け外しで作らない。
  reason: フォーカスの移動、Esc キーでの閉じる操作、トップレイヤーへの表示、ページ内検索での展開を、ブラウザが引き受けてくれるため。
  aiProne: true
  page: interaction/disclosure
  since: 0.1.0

- id: dialog-command-attributes
  level: 推奨
  kind: judgment
  rule: モーダルの開閉は `command` 属性と `commandfor` 属性で行い、対応していないブラウザのためにポリフィルを読み込む。
  reason: '`showModal()` を呼ぶ JavaScript を書かずに済み、開閉のボタンが `<button>` に限られるので、マークアップの誤りも防げるため。'
  page: interaction/disclosure
  since: 0.1.0

- id: dialog-closedby-any
  level: 推奨
  kind: judgment
  rule: 背景のクリックで閉じるモーダルは `closedby="any"` で作り、クリックの位置を判定する処理を自作しない。
  reason: Esc キーと背景のクリックによる閉じる操作を、ブラウザの標準の振る舞いにそろえられるため。
  note: 'Safari などの対応していないブラウザでも、Esc キーと閉じるボタンでは閉じられます。背景のクリックでも閉じる必要があるときは、ポリフィル（`dialog-closedby-polyfill`）を読み込みます。'
  page: interaction/disclosure
  since: 0.1.0

- id: no-custom-focus-trap
  level: 禁止
  kind: judgment
  rule: モーダルに、独自のフォーカストラップを実装しない。
  reason: '`showModal()` で開いたダイアログは背面を操作できない状態にするので不要であり、ブラウザのツールバーへの移動まで妨げてしまうため。'
  page: interaction/disclosure
  since: 0.1.0

- id: overscroll-contain-in-overlay
  level: 推奨
  kind: spec
  rule: 'モーダルやドロワーの中でスクロールする要素には、`overscroll-behavior-block: contain` のように、スクロールする方向の軸だけにスクロールの連鎖を止める指定をする。'
  reason: 中の要素を端までスクロールしたときに、背面のページが続けてスクロールするのを防ぐため。
  note: '`dialog` と `[popover]` 自体には kiso.css が指定しています。軸を付けない `overscroll-behavior` は、横のスワイプで前のページに戻る操作まで止めてしまいます。'
  page: interaction/disclosure
  since: 0.3.0

- id: inert-attribute-for-background
  level: 推奨
  kind: spec
  rule: '`<dialog>` のモーダルにできないドロワーで背面を操作できなくするときは、`interactivity: inert` ではなく、JavaScript で背面の要素に `inert` 属性を付ける。'
  reason: '`interactivity` に対応していない環境では背面を操作できてしまい、見えないリンクにフォーカスが移るため。'
  note: 'CSS で書く場合も、`body:has()` ではなく、`.global-header:has(…) ~ *` のように起点をヘッダーに絞ります。'
  aiProne: true
  page: interaction/disclosure
  since: 0.5.0

- id: details-name-for-exclusive
  level: 推奨
  kind: judgment
  rule: 1つだけを開くアコーディオンは、同じ `name` 属性を付けた `<details>` で作る。
  reason: JavaScript を書かずに、ほかの項目を閉じる動作をブラウザに任せられるため。
  page: interaction/disclosure
  since: 0.1.0

- id: no-heading-in-summary
  level: 禁止
  kind: spec
  rule: '`<summary>` の中に見出しの要素を入れない。'
  reason: '`<summary>` の中では見出しの役割が失われ、見出しで移動するユーザーが項目にたどり着けなくなるため。'
  note: 見出しの構造が必要なら、`hidden="until-found"` を使ったアコーディオンにします。
  page: interaction/disclosure
  since: 0.1.0

- id: details-content-for-panel
  level: 推奨
  kind: judgment
  rule: '`<details>` の開閉する部分の余白や開閉の動きは、`::details-content` に指定する。'
  reason: 中身を包む要素を足さずに済み、閉じる動きまで CSS だけで書けるため。
  page: interaction/disclosure
  since: 0.1.0

- id: hidden-until-found-for-panels
  level: 推奨
  kind: judgment
  rule: 'タブやアコーディオンの閉じたパネルは `hidden="until-found"` で隠し、`display: none` で隠さない。'
  reason: ページ内検索やページ内リンクで中身が見つかったとき、ブラウザが自動でパネルを開くため。
  aiProne: true
  page: interaction/disclosure
  since: 0.1.0

- id: hide-panels-after-init
  level: 必須
  kind: judgment
  rule: 開閉するパネルは初期のHTMLでは隠さず、開閉の処理の初期化が成功してから JavaScript で隠す。
  reason: JavaScript が無効な環境や、スクリプトの読み込みや実行に失敗した環境でも、中身を読めるようにするため。
  aiProne: true
  page: interaction/disclosure
  since: 0.2.0

- id: no-box-style-on-until-found
  level: 非推奨
  kind: spec
  rule: '`hidden="until-found"` を付ける要素自体には、余白、枠線、背景を指定しない。'
  reason: '対応したブラウザは `content-visibility: hidden` で中身だけを隠すので、要素自体の余白や枠線は閉じていても表示されるため。'
  note: 余白や背景は、内側の要素に指定します。
  page: interaction/disclosure
  since: 0.1.0

# 17-7 フォーム部品
- id: accent-color-for-color-only
  level: 推奨
  kind: judgment
  rule: チェックボックス、ラジオボタン、スライダーの色を変えるだけなら、`accent-color` を使う。
  reason: ブラウザの部品の操作性やアクセシビリティをそのまま保てるため。
  page: interaction/forms
  since: 0.1.0

- id: style-input-directly
  level: 推奨
  kind: judgment
  rule: 'チェックボックスやラジオボタンの見た目を作り直すときは、`input` 自体に `appearance: none` を指定して描き、`input` を隠して別の要素で描かない。'
  reason: キーボードで操作できなくなる事故を防げ、フォーカスリングもそのまま表示されるため。
  aiProne: true
  page: interaction/forms
  since: 0.1.0

- id: no-aspect-ratio-on-input
  level: 非推奨
  kind: spec
  rule: '`input` 要素の大きさを `aspect-ratio` で決めない。'
  reason: Safari で縦横の比率が保たれず、部品が潰れることがあるため。
  note: '`inline-size` と `block-size` の両方を指定します。'
  page: interaction/forms
  since: 0.1.0

- id: base-select-in-supports
  level: 推奨
  kind: spec
  rule: '`<select>` の見た目を `appearance: base-select` で変えるときは、`::picker(select)`、`::picker-icon`、`option::checkmark` の指定も含めて `@supports (appearance: base-select)` の中に書く。'
  reason: '未対応の環境（Firefox）でブラウザの標準の `<select>` のまま表示させ、`base-select` を前提にした余白や枠線が標準の部品に当たるのを防ぐため。'
  note: '`appearance: base-select` は、`<select>` と `::picker(select)` の両方に指定します。選んだ項目の中身をボタンに表示するには、`<select>` の最初の子に `<button>` を置き、その中に `<selectedcontent>` を書きます。`<div>` と JavaScript でドロップダウンを作り直すことはしません。'
  page: interaction/forms
  since: 0.21.0

- id: switch-attribute-progressive
  level: 推奨
  kind: judgment
  rule: スイッチは `<input type="checkbox" switch>` で作り、`switch` 属性に対応していない環境でチェックボックスとして扱われることを許容する。
  reason: 対応した環境ではスクリーンリーダーがオンとオフで読み上げ、未対応の環境でも操作は損なわれないため。
  note: 'すべての環境でスイッチとして読み上げる必要がある場合は、`role="switch"` を加えます。`<button>` と `aria-pressed` はトグルボタンを表し、オンとオフの意味にならないので使いません。'
  page: interaction/forms
  since: 0.1.0

- id: user-invalid-for-errors
  level: 推奨
  kind: spec
  rule: 入力エラーの見た目は、`:invalid` ではなく `:user-invalid` に指定する。
  reason: '`:invalid` は入力する前から当てはまり、ページを開いた時点でエラーが表示されてしまうため。'
  aiProne: true
  page: interaction/forms
  since: 0.1.0

- id: field-sizing-for-textarea
  level: 推奨
  kind: judgment
  rule: '`<textarea>` には `field-sizing: content` を指定し、最小と最大の高さを `lh` 単位で決める。'
  reason: 入力した量に合わせて入力欄が伸び縮みし、未対応の環境では従来どおりの入力欄になるだけなため。
  page: interaction/forms
  since: 0.1.0

- id: input-font-size-min-1rem
  level: 推奨
  kind: spec
  rule: 入力欄の文字サイズは `1rem`（16px 相当）以上にする。
  reason: iOS の Safari は、文字サイズが16px 未満の入力欄にフォーカスすると画面を拡大し、ページの見え方が変わってしまうため。
  aiProne: true
  page: interaction/forms
  since: 0.1.0

- id: no-maximum-scale
  level: 禁止
  kind: spec
  rule: 入力欄での拡大を防ぐために、`<meta name="viewport">` の `maximum-scale` や `user-scalable=no` でズームを止めない。
  reason: 拡大して読む必要のあるユーザーが、ページを拡大できなくなるため。
  aiProne: true
  page: interaction/forms
  since: 0.1.0

# 17-8 CSS でカルーセルを作る
- id: no-autoplay-carousel
  level: 禁止
  kind: judgment
  rule: カルーセルを自動で再生しない。
  reason: 読み上げや操作の途中で内容が切り替わり、一時停止の手段を用意しても問題が残るうえ、自動で切り替わるスライドをユーザーは最後まで見ないため。
  note: カルーセルにする前に、カードを一覧で並べられないかを検討します。
  aiProne: true
  page: interaction/carousel
  since: 0.5.0

- id: carousel-controls-in-supports
  level: 必須
  kind: spec
  rule: '`::scroll-button()`、`::scroll-marker`、`scroll-marker-group`、`scrollbar-width: none` は、`@supports selector(::scroll-button(*))` などの中に書く。'
  reason: 未対応の環境ではボタンとインジケーターが表示されないので、スクロールバーを残して横スクロールとして読めるようにし、Safari でネストした以降のスタイルが無効になるのも防ぐため。
  note: 土台はスクロールスナップの横スクロールにし、ボタンとインジケーターはプログレッシブ・エンハンスメントとして足します。
  aiProne: true
  page: interaction/carousel
  since: 0.5.0

- id: carousel-inert-unsnapped
  level: 推奨
  kind: judgment
  rule: 'カルーセルのスライドを `container: --<名前> / scroll-state` のコンテナにし、止まっていないスライドの中身を `@container --<名前> not scroll-state(snapped: inline)` で `interactivity: inert` にする。'
  reason: 隠れているスライドが読み上げとフォーカスの対象から外れ、見えている1枚の後にカルーセルの後ろの要素へ移れるため。
  note: '1枚ずつ表示するカルーセルが前提です。複数枚を表示すると、見えていてもスナップの位置にないスライドが不活性になるので、条件を見直すか、この指定を使いません。`interactivity` は継承し、子孫から `auto` で打ち消せません。コンテナクエリで変えられるのは子孫だけなので、スライドではなくその中の要素に指定します。'
  page: interaction/carousel
  since: 0.5.0
