# 第19章 実務での運用

# 19-1 Stylelintでルールを守る
- id: run-stylelint-before-done
  level: 必須
  kind: convention
  rule: CSS を変更したら Stylelint を実行し、エラーを残さない。
  reason: 機械的に判断できる違反をレビューに持ち込まず、レビューを命名や設計の判断に集中させるため。
  page: operations/stylelint
  since: 0.1.0

- id: no-disabling-to-silence
  level: 禁止
  kind: judgment
  rule: エラーや警告を消すことだけを目的に、ルールを無効にしたり検査を飛ばしたりしない。
  reason: 違反がなくなるのではなく見えなくなるだけで、同じ誤りが残り続けるため。
  aiProne: true
  page: operations/stylelint
  since: 0.1.0

- id: disable-one-line-with-reason
  level: 必須
  kind: convention
  rule: ルールを無効にするときは、`stylelint-disable-next-line` とルール名で1行・1つのルールに絞り、直前のコメントに理由を書く。
  reason: 範囲を広げると、同じ場所にある別の誤りまで見逃すうえ、なぜ無効にしたのかが後から分からなくなるため。
  note: '1つの宣言が2つ以上のルールに掛かるときは、`-next-line` のコメントを同じ行に2つ書けないので、1つのコメントにルール名を並べます。ルールが報告しない宣言には、無効にするコメントを書きません。不要な無効化は `stylelint --report-needless-disables` で見つけられます。'
  page: operations/stylelint
  since: 0.1.0

- id: autofix-mechanical-issues
  level: 推奨
  kind: judgment
  rule: プロパティの並び順のように自動で直せる違反は、手で直さず、`stylelint --fix` とエディタの保存時の自動修正に任せる。
  reason: 整形はツールの仕事で、人が手作業でそろえると時間がかかるうえ、漏れが出るため。
  page: operations/stylelint
  since: 0.1.0

- id: disallowed-list-with-message
  level: 推奨
  kind: convention
  rule: 禁止リストのルール（`unit-disallowed-list` など）には、`message` で代わりの書き方を示す。
  reason: 何を書けばよいかがその場で分かり、ルールを無効にして済ませる動機を減らせるため。
  page: operations/stylelint
  since: 0.1.0

- id: warning-for-judgement-rules
  level: 推奨
  kind: convention
  rule: 置き換え先を人が選ぶ必要のあるルールは警告に、正解が1つに決まるルールはエラーにする。
  reason: 機械的に直せる違反は確実に止め、判断の要る違反は人に判断を促せるため。
  page: operations/stylelint
  since: 0.1.0

- id: resolve-warnings
  level: 推奨
  kind: judgment
  rule: 警告は放置せず、直すか、意図して使う場合は理由を添えてルールを1行だけ無効にする。
  reason: 警告を放置すると、本当に直すべき警告が一覧に埋もれ、誰も警告を読まなくなるため。
  note: 警告だけでは Stylelint の終了コードは失敗になりません。CI で警告も失敗にするときは、`--max-warnings 0` を付けて実行します。
  page: operations/stylelint
  since: 0.1.0

- id: lint-config-matches-guideline
  level: 必須
  kind: judgment
  rule: ガイドラインのルールを変えたら、Stylelint の設定も合わせて変え、本文と設定を食い違わせない。
  reason: 設定がガイドラインの意図とずれると、ツールが誤りを直すどころか、誤りを強制するため。
  page: operations/stylelint
  since: 0.1.0

- id: lint-documented-examples
  level: 推奨
  kind: judgment
  rule: ガイドラインや設計のドキュメントに載せる推奨のコード例も、同じ Stylelint の設定で検証する。
  reason: コード例が自分のルールに違反していると、ドキュメントが信用されず、AI にもそのまま手本として真似されるため。
  page: operations/stylelint
  since: 0.1.0

# 19-2 レビューの進め方
- id: review-reason-and-solution
  level: 必須
  kind: judgment
  rule: レビューの指摘には、理由と解決策を必ずセットで書く。
  reason: 何が問題で、どう直せばよいかが伝わらないと、書いた人が調べ直すことになり、同じ誤りを繰り返すため。
  note: 本書のルールに当てはまる指摘には、ルールの ID を添えます。
  page: operations/review
  since: 0.1.0

- id: review-severity-labels
  level: 推奨
  kind: convention
  rule: レビューの指摘には `MUST`、`IMO`、`Q` のラベルを付けて、深刻度を区別する。
  reason: 直さなければならない指摘と、好みの提案と、質問が混ざらないようにするため。
  note: '`MUST` は、仕様や規約への違反、バグ、将来の深刻な問題、使いやすさやアクセシビリティの阻害です。'
  page: operations/review
  since: 0.1.0

- id: review-preferences-as-imo
  level: 推奨
  kind: judgment
  rule: 挙動に問題がなく、合意のない好みが入る指摘は `IMO` にとどめ、修正を強制しない。
  reason: 教義的なレビューは、ユーザーやクライアントのメリットにならない修正を増やすため。
  note: 規約として合意したルールへの違反は、`MUST` として指摘します。
  page: operations/review
  since: 0.1.0

- id: review-ask-unclear-intent
  level: 推奨
  kind: judgment
  rule: 意図が読み取れない記述は、誤りと決めつけずに `Q` で質問する。
  reason: 書いた人にしか分からない事情がある場合があり、理由が分かればコメントとして残せるため。
  page: operations/review
  since: 0.1.0

- id: review-check-order
  level: 推奨
  kind: convention
  rule: レビューは、規約、トークン、ブラウザ対応、不要な記述、グローバルの CSS、内容の変化への耐性、コンポーネントの境界、レスポンシブ、コメントの順に確認する。
  reason: 影響の大きい問題から確かめ、細部の指摘に埋もれて重大な問題を見逃すのを防ぐため。
  note: インデントや並び順のような整形は、ツールが機能していないときだけ指摘します。
  page: operations/review
  since: 0.1.0

- id: cite-rule-ids
  level: 推奨
  kind: convention
  rule: レビューのコメントと AI への指示では、ルールを ID で引用する（例：`no-vw-vh`）。
  reason: ID は章の構成が変わっても変わらず、どのルールのことかが正確に伝わるため。
  page: operations/review
  since: 0.1.0

# 19-3 表示と操作を確かめる
- id: verify-worst-case-content
  level: 推奨
  kind: judgment
  rule: 実装後は、長い見出し、折り返せない文字列、読み込めない画像、0件・1件・多数の項目を入れたテストページで表示を確かめる。
  reason: デザインカンプのダミーテキストは崩れる条件をほとんど含まず、実際の内容で初めてはみ出しや重なりが見つかるため。
  note: 幅は320px、480px、768px、1024px、1280pxで確かめ、その後に間の幅も連続して変えて見ます。
  page: operations/verification
  since: 0.35.0

- id: verify-text-resize-200
  level: 必須
  kind: spec
  rule: ブラウザのズームと文字サイズの設定をそれぞれ200%にしても、内容が欠けず、操作できることを確かめる。
  reason: 'WCAGの達成基準1.4.4が、支援技術なしで文字を200%まで拡大しても内容や機能が失われないことを求めているため。'
  note: 'WCAGの達成基準は、ブラウザの拡大の手段のどれか1つで200%にできれば満たせます。ページ全体のズーム、既定の文字サイズの変更、文字だけのズームをそれぞれ確かめるのは、操作ごとに見つかる崩れが違うために本書が加えた手順です。'
  page: operations/verification
  since: 0.35.0

- id: verify-reflow-400
  level: 必須
  kind: spec
  rule: 幅1280 CSS pxのウィンドウでページを400%に拡大し、ページ全体に横スクロールが出ず、固定した部品が本文やフォーカスした要素を覆わないことを確かめる。
  reason: 'WCAGの達成基準1.4.10が、幅320 CSS px相当で2方向のスクロールなしに内容と機能を使えることを求めており、ズームでは高さも縮むので、幅を狭めただけでは固定した部品の覆い方を再現できないため。'
  note: 表、地図、図のように2次元の配置が要る部分は、その部分の中だけで横にスクロールさせてかまいません。周りの見出しや操作は例外になりません。
  page: operations/verification
  since: 0.66.0

- id: verify-text-spacing-override
  level: 必須
  kind: spec
  rule: '行の高さを文字サイズの1.5倍、段落の後ろの余白を2倍、字間を0.12倍、語間を0.16倍に `!important` で上書きし、文字が切れず、重ならず、部品の中身が隠れないことを確かめる。'
  reason: 'WCAGの達成基準1.4.12が、利用者がテキストの間隔をこの値まで広げても内容や機能が失われないことを求めており、高さを固定した箱は上書きした時点で文字を切るため。'
  note: '和文の部分では語間は変わらず、字間を広げると字面が離れます。見るのは読みやすさではなく、欠けや重なりがないかです。'
  page: operations/verification
  since: 0.66.0

- id: verify-keyboard-and-display-settings
  level: 推奨
  kind: judgment
  rule: キーボードだけで操作し、強制カラーモード、動きを減らす設定、グレースケールの表示を再現して確かめる。
  reason: フォーカスの見え方と移動の順番、色に頼った表現、止まらない動きは、コードを読むだけでは見落としやすく、条件を再現すると見つかるため。
  note: 強制カラーモードと動きを減らす設定は、Chromeの開発者ツールの「Rendering」パネルで再現できます。
  page: operations/verification
  since: 0.35.0

# 19-4 表示の崩れを開発者ツールで調べる
- id: devtools-find-winning-declaration
  level: 推奨
  kind: judgment
  rule: '宣言が効かないときは、詳細度を上げたり `!important` を付けたりする前に、開発者ツールで勝っている宣言と、差が付いた段階（レイヤー、詳細度、スコープの近さ、出現順）を確かめる。'
  reason: '負けた理由を確かめずに順位を引き上げると、レイヤーの順番の誤りなどの原因が残り、上書きが積み重なるため。'
  note: '取り消し線のない宣言が効かないときは、条件を満たさない宣言か、未定義のカスタムプロパティの参照（計算値の時点で無効）を疑う。'
  aiProne: true
  page: operations/devtools
  since: 0.35.0

- id: devtools-narrow-cause-then-fix-source
  level: 推奨
  kind: judgment
  rule: '崩れを直すときは、開発者ツールで値を一時的に書き換えて原因の宣言を1つに絞り、その宣言をソースのCSSで直す。'
  reason: '原因を絞らずに直すと、症状を消すだけの宣言が増え、開発者ツールでの変更は再読み込みで消えるため。'
  page: operations/devtools
  since: 0.35.0

# 19-5 CMSのWYSIWYG本文にスタイルを当てる
- id: wysiwyg-scope-root
  level: 推奨
  kind: judgment
  rule: CMS の WYSIWYG が出力する本文エリアには `wysiwyg` クラスを付け、`@scope (.wysiwyg)` の中にタイプセレクタで書く。
  reason: 編集者は要素にクラスを付けられず、子孫セレクタで書くと詳細度が上がり、独自ブロックの側に打ち消しが要るため。
  note: 本文エリアは、`scoped <名前>` の規約（第4章）の例外です。`.scoped` のクラスを付けられるのは、コードを書く人だけだからです。
  page: operations/wysiwyg
  since: 0.4.0

- id: wysiwyg-cms-prefix
  level: 推奨
  kind: convention
  rule: 編集画面から挿入する独自のブロックには `cms-` で始まるクラスを `class` 属性の先頭に付け、本文エリアの `@scope` を `to ([class|="cms"])` で手前で止める。
  reason: 本文エリアの見出しや段落のスタイルが、独自ブロックの中に漏れるのを防ぐため。
  note: '`[class|="cms"]` は、`class` 属性の値の全体が `cms` か `cms-` で始まるときだけ一致します。`class="foo cms-x"` には一致しません。'
  aiProne: true
  page: operations/wysiwyg
  since: 0.4.0

- id: wysiwyg-scope-exception
  level: 推奨
  kind: convention
  rule: CMS の本文エリアに限り、`@scope` のネストと、独自ブロックの `@scope` での `to()` の省略を認める。
  reason: 本文エリアと独自ブロックの2段だけで、ブロックの中にコンポーネントを置かない前提が成り立てば、スタイルの漏れが起きにくいため。
  note: ブロックの中にコンポーネントを入れるなら、通常の `@scope (.scoped.<名前>) to (.scoped)` に戻します。
  page: operations/wysiwyg
  since: 0.4.0

- id: wysiwyg-flow-margin
  level: 推奨
  kind: judgment
  rule: 本文のブロック間の余白は、2つ目以降の直下の子に `margin-block-start` を `rlh` で付け、見出しと独自ブロックの前だけ広げる。
  reason: 見出しや段落の行間が違っても、余白がルート要素の行の高さの倍数で揃うため。
  note: 中にブロックを持つ `blockquote` などは、中の余白を `0.5rlh` に詰めます。
  page: operations/wysiwyg
  since: 0.4.0

# 19-6 既存のサイトに段階的に導入する
- id: adopt-new-components-first
  level: 推奨
  kind: judgment
  rule: '既存のサイトに本書の規約を入れるときは、全体を一度に書き換えず、新しく作るコンポーネントと、変更で手を入れるページやコンポーネントから適用する。'
  reason: 書き換えのためだけに表示の確認を増やさず、規約の違う部分を変更のたびに減らせるため。
  note: '変更の予定がない箇所は、規約と違っていても書き換えない。'
  page: operations/adoption
  since: 0.35.0

- id: legacy-css-into-vendors
  level: 推奨
  kind: judgment
  rule: '既存のサイトにレイヤーを入れるときは、既存のCSSを `@import url("…") layer(vendors);` で `vendors` レイヤーに入れ、新しいCSSを後ろのレイヤーに書く。'
  reason: 'レイヤーの外に残った既存のCSSは、詳細度に関係なく新しいCSSに勝つため。`vendors` に入れれば、既存のページの表示を保ったまま、新しいコンポーネントを優先できる。'
  note: '既存のCSSを読み込み直せない環境では、`no-layers-with-unlayered-css` に従う。リセットとベーススタイルは、既存のページの表示を確かめられる段階で足す。'
  page: operations/adoption
  since: 0.35.0

- id: lint-new-code-first
  level: 推奨
  kind: judgment
  rule: 'Stylelint は新しいCSSを置くディレクトリから適用し、既存のCSSのディレクトリは `ignoreFiles` で外して、書き換えたファイルから検査の対象に戻す。'
  reason: '既存のCSSの大量の違反に、新しいコードの違反が埋もれないようにするため。`ignoreFiles` に残るパスが、規約で書かれていないCSSの一覧になる。'
  note: '外すのは規約で書いていないコードだけで、新しいコードの違反を隠す目的では使わない（`no-disabling-to-silence`）。'
  page: operations/adoption
  since: 0.35.0
