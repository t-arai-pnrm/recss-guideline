# 第16章 画像・装飾

# 16-1 画像の配置と比率
- id: aspect-ratio-for-ratios
  level: 必須
  kind: judgment
  rule: 要素の縦横比は `aspect-ratio` で決め、`padding-top` の割合で高さを作らない。
  reason: 比率のための擬似要素や絶対配置が要らず、比率の指定だとコードから読み取れるため。
  note: '正方形や正円は `aspect-ratio: 1` で作ります。'
  page: decoration/images
  since: 0.1.0

- id: object-fit-cover-or-contain
  level: 推奨
  kind: judgment
  rule: 大きさを決めた画像や動画には `object-fit` の `cover` か `contain` を指定し、初期値の `fill` で引き伸ばさない。
  reason: 比率の違う画像が入っても歪まないようにするため。
  note: '写真のように枠を埋めたい画像は `cover`、ロゴのように切り取られると困る画像は `contain` にします。ベーススタイルで `img` と `video` を `cover` にしておく方法もあります。'
  page: decoration/images
  since: 0.1.0

- id: img-width-height-attributes
  level: 必須
  kind: spec
  rule: '`<img>` には、画像の実際の大きさを `width` と `height` の属性で書く。'
  reason: ブラウザが読み込む前から縦横比を計算して場所を確保し、読み込んだときにレイアウトがずれるのを防ぐため。
  aiProne: true
  page: decoration/images
  since: 0.1.0

- id: text-on-image-fallback-background
  level: 必須
  kind: spec
  rule: 画像や動画の上に文字を載せるときは、画像が表示されなくても文字を読める背景色を指定する。
  reason: 画像を読み込めないと、文字と背景の色が近くなり、文字を読めなくなることがあるため。
  note: '背景色は文字色から決めます。`sign()` の宣言を先に書き、`contrast-color(currentColor)` で上書きします（ルール `contrast-color-for-image-fallback`）。`contrast-color()` だけだと、対応していない環境で背景色が付かず、画像が表示されないときに文字が読めなくなります。'
  page: decoration/images
  since: 0.1.0

- id: outline-for-image-edge
  level: 推奨
  kind: judgment
  rule: '白い背景の画像が入りうる場所では、画像に負の `outline-offset` を付けた `outline` で内側に線を引き、縁を示す。`box-shadow: inset` や `border` では描かない。'
  reason: '内側の影は画像の下に描かれて見えず、`border` は `border-box` の画像を線の分だけ小さくするため。`outline` は中身より手前に描かれ、大きさを変えない。'
  note: '線の色は枠線のトークンから選びます。'
  page: decoration/images
  since: 0.49.0

- id: img-over-background-image
  level: 推奨
  kind: judgment
  rule: 背景に写真を敷くときは、`background-image` ではなく、`object-fit` を指定した `<img>` を本文と同じグリッドのエリアに置く。
  reason: '`<picture>` や `srcset` と `sizes` で表示される幅に合った画像を読み込め、`opacity` やフィルターで画像だけを加工でき、`alt` で意味を伝えられるうえ、HTML を解析する段階でプリロードスキャナーに見つかり、LCP の候補でも表示が遅れないため。'
  note: '`background-image` は、`background-repeat` で敷き詰めるパターン画像や、内容と関係のない細かな装飾に使います。1枚だけ置く装飾には、`background-repeat: no-repeat` を明示します。単色やグラデーションだけの背景も `background-image` で足ります。装飾の写真なら `alt=""` にします。重ねるだけの入れ物には、コンポジションの `pile` を使えます。'
  aiProne: true
  page: decoration/images
  since: 0.18.0

# 16-2 画像の形式と読み込み
- id: sizes-by-tool
  level: 推奨
  kind: judgment
  rule: '`srcset` と `sizes` の値は、手で計算せず、RespImageLint などのツールで確かめて決める。'
  reason: 表示される幅は余白や段組みの切り替えによって変わり、手で計算すると誤りやすいため。
  page: decoration/image-loading
  since: 0.1.0

- id: no-lazy-loading-first-view
  level: 禁止
  kind: spec
  rule: 'ファーストビューに表示される画像に、`loading="lazy"` を指定しない。'
  reason: ページでいちばん大きな要素の表示が遅れるため。
  note: '`fetchpriority="high"` は、LCP の候補になる画像（ファーストビューでいちばん大きく表示される画像）にだけ指定します。ファーストビューの画像すべてに指定すると、優先する画像どうしで帯域を奪い合うためです。`loading="lazy"` は、スクロールしないと見えない画像と `<iframe>` にだけ付けます。ページ内のすべての `<img>` に一括では付けません。遅延読み込みは処理を先送りするだけで、スクロールや操作の最中に処理が重なると INP や体感を悪くするためです。遅延読み込みする要素にも、`width` と `height` の属性か `aspect-ratio` で場所を確保します。'
  aiProne: true
  page: decoration/image-loading
  since: 0.1.0

- id: no-decoding-async
  level: 推奨
  kind: judgment
  rule: '`<img>` に `decoding="async"` を指定せず、デフォルトの `auto` に任せる。'
  reason: キャッシュのない通常の読み込みでは `sync` と `async` に目立った性能の差がなく、キャッシュがあるときに `async` だと、画像以外が先に表示されて画像があとから現れ、画面がちらつくため。
  aiProne: true
  page: decoration/image-loading
  since: 0.18.0

- id: image-format-by-role
  level: 推奨
  kind: judgment
  rule: '写真と、エッジや形が大事な画像は AVIF で書き出す。テキストの下に敷く LCP の候補の写真や、画質を重視する写真は、JPEG XL を `<picture>` の `<source type="image/jxl">` に置き、`<img>` に AVIF を書く。'
  reason: 'AVIF は同じくらいの画質なら WebP より10〜30%ほど小さくなるのが目安で、可逆圧縮と透過にも対応し、すべての主要なブラウザが対応しているため。JPEG XL は AVIF より高度なプログレッシブ表示ができ、読み込みの途中から全体像を見せられるが、Baseline ではないため。'
  note: 'AVIF の変換ツールの多くは既定で非可逆に書き出すので、エッジや形が大事な画像は可逆圧縮を指定し（sharp なら `lossless: true`）、元の画像と等倍で比べて確かめます。可逆圧縮の AVIF が PNG より大きくなる画像は、PNG のまま使うか、SVG で描けないかを考えます。AVIF への変換は WebP の2倍以上の時間がかかることがあります。ビルドを頻繁に繰り返すプロジェクトや開発の段階では、作る側の都合で WebP を選んでもかまいません。図形で描けるイラストやアイコンは、画像のファイルにせず SVG にします。'
  page: decoration/image-loading
  since: 0.1.0

# 16-3 アイコンとSVG
- id: icon-current-color
  level: 推奨
  kind: judgment
  rule: 単色のアイコンの色は `currentColor` で文字色に合わせ、状態ごとにアイコンの色を指定し直さない。
  reason: 文字色を切り替えるだけでアイコンも追従し、色を2か所に書く必要がなくなるため。
  note: '`border` の色も、省略すれば `currentColor` になります。'
  page: decoration/icons-and-masks
  since: 0.1.0

- id: inline-svg-accessible-name
  level: 推奨
  kind: judgment
  rule: '意味を持つインライン SVG のアイコンには、`role="img"` と `aria-label` で名前を付ける。名前をページ内検索や選択してのコピーの対象にしたいときは、SVG を `aria-hidden="true"` にし、隣に視覚的に隠したテキストを置く。'
  reason: '`role="img"` を付けると SVG の図形がまとめて1つの画像として扱われ、`aria-label` の名前が支援技術に伝わるため。`aria-label` は主要なブラウザの翻訳機能でも訳されるが、ページ内検索とコピーの対象にはならない。'
  note: '装飾だけのアイコンと、隣のテキストと同じ意味のアイコンは、`aria-hidden="true"` にして名前を付けません。'
  page: decoration/icons-and-masks
  since: 0.1.0

- id: menu-icon-inline-svg
  level: 推奨
  kind: judgment
  rule: 'メニューのボタンの三本線は、空の要素を並べて CSS で線にせず、インライン SVG で描く。`viewBox`、`fill`、`stroke`、`stroke-width` は属性で書き、線を個別に動かすなら `path` を線ごとに分ける。'
  reason: 'SVG は CSS が読み込まれなくても図形として表示され、マークアップから形が分かるため。空の要素は、CSS で幅、高さ、背景色を与えないと何も表示されない。'
  note: 'ボタンの名前は、見える文字かボタンの `aria-label` で付け、SVG は `aria-hidden="true"` にします。開いている間に×へ変えるときは、各 `path` に `transform-box: fill-box` と `transform-origin: center` を指定して、線ごとに回します。'
  aiProne: true
  page: decoration/icons-and-masks
  since: 0.80.0

# 16-4 clip-pathとマスクで見せる範囲を決める
- id: clip-path-shape-tokens
  level: 推奨
  kind: judgment
  rule: 三角形などの図形は `border` の組み合わせではなく `clip-path` で描き、`polygon()` の値は `--shape--triangle-bottom` のようなトークンにする。
  reason: 図形の大きさを幅と高さで決められ、どのような形なのかが名前から分かるため。
  aiProne: true
  page: decoration/clipping-and-masks
  since: 0.1.0

- id: scroll-edge-fade-with-mask
  level: 推奨
  kind: judgment
  rule: スクロールできる領域の端を薄くして続きを示すときは、端に線や背景と同じ色のグラデーションを重ねず、スクロールコンテナの `mask-image` に両端が透明になるグラデーションを指定する。
  reason: 中身そのものが端で薄れるので、背景が写真や別の色でも帯が浮かず、線のように区切りとして読まれることもないため。
  note: '`linear-gradient()` の向きには論理方向のキーワードがないので、両端を同じ幅で薄くして書字方向に左右されない形にします。マスクは要素の外側に描く `outline` も切り取るので、スクロールコンテナがフォーカスを受けるときは、リングを親の `:has(:focus-visible)` に出します。'
  page: decoration/clipping-and-masks
  since: 0.21.0

- id: cutout-overlap-with-mask
  level: 推奨
  kind: judgment
  rule: 重なった要素の周りに隙間を見せるときは、手前の要素に背景と同じ色の `border` や `box-shadow` を付けず、奥の要素の重なる部分を `mask-image` で切り抜く。切り抜く位置と大きさは、手前の要素の大きさと隙間の幅から `calc()` で求める。
  reason: 背景の色で塗った縁は、置いた場所の背景がページの背景と同じときにしか隙間に見えず、カードの面やダークモード、写真やグラデーションの上では輪として浮くため。
  note: '円く切り抜くマスクは `radial-gradient()` で書き、透明から黒への境目を1pxずらして縁をなめらかにします。中心の横の位置は左から数えるので、`inset-inline-end` で置いた要素を切り抜くときは `:dir(rtl)` で位置を反転させます。マスクは切り抜いた要素の `outline` と `box-shadow` も切り取るので、フォーカスリングは切り抜かない要素に出します。'
  aiProne: true
  page: decoration/clipping-and-masks
  since: 0.56.0

# 16-5 面・影・角丸
- id: surface-levels-by-role
  level: 推奨
  kind: judgment
  rule: 面の背景は、ページ、カード、ダイアログ、メニューの役割で決めた段階のトークンから選び、置かれた面からの相対的な高さで決めない。
  reason: 役割で固定すれば、どこに置かれても同じトークンを参照するだけで済み、祖先の値をスタイルクエリで読む例外を作らずに済むため。
  note: '本書のデモでは `--background--base`（ページ）、`--background--surface`（カード）、`--background--overlay`（ダイアログ）、`--background--raised`（メニューやポップオーバー）の4段階です。メニューはダイアログの中でも開くので、ダークモードでは `raised` を `overlay` より明るくします。'
  page: decoration/surfaces
  since: 0.38.0

- id: lighter-surface-in-dark-mode
  level: 推奨
  kind: judgment
  rule: ダークモードでは、高い面ほど背景を明るくし、面の高さを影だけで表さない。
  reason: 暗い背景の上では影がほとんど見えず、影だけでは面の重なりが読み取れないため。
  note: '明るい背景は、ページの背景のプリミティブから `oklch(from var(--color--neutral--900) calc(l + 0.085) c h)` のように相対カラー構文で作ります。ライトモードでは、ページ以外の面を白にし、高さを影で表します。'
  aiProne: true
  page: decoration/surfaces
  since: 0.38.0

- id: shadow-black-in-dark-mode
  level: 推奨
  kind: judgment
  rule: 影の色は `light-dark()` で切り替える色のトークンにし、ダークモードでも黒のまま不透明度を上げる。
  reason: '`box-shadow` の値は `light-dark()` で書き分けられず、暗い背景に白い影を付けると、影ではなく光って見えるため。'
  note: '影の形は1組だけ定義し、各層の色に `--shadow--color` などのトークンを使います。ダークモードで面の端を見せる上辺のハイライトと内側の縁取りは、ライトモードでは `transparent` にします。色のある背景に落とす影は、背景の色相に寄せると背景がくすみません。'
  page: decoration/surfaces
  since: 0.1.0

- id: shadow-tokens-light-source
  level: 推奨
  kind: judgment
  rule: 影のトークンは光源の向きをそろえ、段階が上がるほど、オフセットとぼかしを倍にした層を足す。
  reason: 各層の不透明度が同じでも、要素の近くほど層が重なって濃くなり、段階が高いほど影が遠くまで落ちるので、段階ごとに調整しなくても高さの関係が一貫して読み取れるため。
  note: '本書のデモでは、層のオフセットとぼかしを1、3、6、12、24、48pxとし、広がりをその半分の負の値にしています。最も低い段階は1pxの縁取りだけで、通常の表示での縁取りに使えます。操作できる範囲や情報の区切りを示す境界に使うときは、強制カラーモードで同じ太さの `outline` を描きます（ルール `no-box-shadow-only-boundary`）。'
  page: decoration/surfaces
  since: 0.4.0

- id: no-animate-layered-shadow
  level: 非推奨
  kind: judgment
  rule: 影を変えるときに、`box-shadow` を `transition` や `animation` で動かさない。
  reason: '`box-shadow` の変化は毎フレーム影を描き直し、層を重ねた段階の高い影ほど計算が増えるので、性能の低い端末ではコマ落ちしやすいため。`filter: drop-shadow()` のトランジションは、Chrome では毎フレームの描き直しが起きなかった（進行の計算はメインスレッドに残り、GPU でフィルターを当てる負荷も残る）。'
  note: '影を動かすときは、`filter` に `drop-shadow()` の影のトークン（本書のデモでは `--drop-shadow--sm`、`--drop-shadow--md`、`--drop-shadow--lg`）を指定して動かします。`box-shadow` 用のトークンは渡せないので、別のトークンにします。`drop-shadow()` は広がりと `inset` を持たず、ぼかしは `box-shadow` の半分の値でほぼ同じ広がりになります（Chrome で確認）。縁取りのように動かさない影は `box-shadow` のままにします。トランジションの前後では `drop-shadow()` の数をそろえます。`box-shadow` の影と同じ見た目になるとは限らないので、並べて確かめます。'
  page: decoration/surfaces
  since: 0.4.0

# 16-7 文字とリストの装飾
- id: marker-for-list-number-style
  level: 推奨
  kind: judgment
  rule: '番号付きリストの番号の色や大きさを変えるときは、`list-style: none` と `::before` ではなく、`::marker` に `color` と `font-size` を指定する。'
  reason: 'リストの意味を保ったまま番号の見た目を変えられ、`list-style: none` の問題も避けられるため。'
  note: '`::marker` には `background` や `border` を指定できず、Safari は `color` と `font-size` しか反映しません（`marker-color-and-font-size-only`）。太くする、円で囲むなど、それ以上の装飾が必要なときだけ、`list-style-type: ""` でマーカーを空にして `::before` に `counter()` で番号を描きます。'
  page: decoration/text-ornaments
  since: 0.4.0

- id: text-stroke-paint-order
  level: 推奨
  kind: spec
  rule: '文字の縁取りは `-webkit-text-stroke` で描き、`paint-order: stroke fill` で塗りの下に置く。'
  reason: 線は字形の輪郭を中心に描かれるので、塗りの上に重ねると内側の半分が塗りを覆い、文字が細く読みにくくなるため。
  note: 見えるのは線の外側の半分なので、線の幅は見せたい縁取りの2倍にします。`-webkit-text-stroke` には接頭辞のない書き方がないので、理由のコメントを添えて Stylelint の警告を無効にします。
  page: decoration/text-ornaments
  since: 0.3.0

- id: inline-decoration-clone-with-prefix
  level: 推奨
  kind: spec
  rule: '行ごとに背景や枠線を敷く装飾は、インラインの要素に `-webkit-box-decoration-break: clone` と `box-decoration-break: clone` を併記して描く。'
  reason: 初期値の `slice` では折り返した位置の `padding` と枠線がなくなり、Safari は接頭辞付きの宣言にしか対応していないため。
  note: '上下の座布団が重ならないように、`line-height` を `1cap + (padding + border + 間隔) * 2` のように座布団の高さから決めます。この `line-height` は長さなので、座布団の中に文字サイズの違う子要素を置かず、理由のコメントを添えて Stylelint の警告を無効にします。改行の位置は `.-br` で決めます。'
  aiProne: true
  page: decoration/text-ornaments
  since: 0.25.0

# 16-8 角の形を変える
- id: corner-shape-guard-when-broken
  level: 推奨
  kind: spec
  rule: '`corner-shape` は、無視されても角丸のまま崩れない宣言ならそのまま書き、`scoop` の擬似要素のように未対応の環境で形が崩れる指定だけを `@supports (corner-shape: …)` の中に書く。'
  reason: 未対応の環境では `corner-shape` が無視されて通常の角丸になり、擬似要素で作った反り返りが外側へ出っ張るため。
  note: '錠剤型のボタンに足す `corner-shape: squircle` は、無視されても錠剤型のままなので、`@supports` で囲みません。`@supports` の条件には、使うキーワードまで書きます。'
  aiProne: true
  page: decoration/shapes
  since: 0.5.0

- id: full-bleed-radius-with-sign
  level: 推奨
  kind: judgment
  rule: '画面いっぱいのときだけ角丸を消すときは、`calc(sign(100lvi - 100% - 許容幅) * 半径) / 半径` のように、要素の幅とビューポートの幅を比べて水平方向の半径だけを切り替える。'
  reason: 余白や最大幅を変えても、要素が画面いっぱいになったときに角丸が消え、ブレイクポイントを別に管理しなくて済むため。
  note: '`/` を省くと、垂直方向の半径の `%` が要素の高さを基準にするので、縦に長い要素では角丸が常に消えます。許容幅は、スクロールバーの幅の分です。`vw` ではなく `lvi` を使います。'
  aiProne: true
  page: decoration/shapes
  since: 0.5.0

- id: squircle-larger-radius
  level: 推奨
  kind: spec
  rule: '角丸を `corner-shape: squircle` に置き換えるときは、見た目の大きさが合うように `border-radius` を大きくし、その指定を `@supports` の中に書く。'
  reason: スクワークルは同じ半径でも円弧の角丸より角が小さく見え、倍率を `if()` で決めるカスタムプロパティは、未対応の環境では `border-radius` ごと無効にするため。
  note: '倍率は半径によって変わります（著者の CodePen では、8px 以上が2倍、24px 以上が1.67倍で `superellipse(1.75)`、32px 以上が1.5倍で `superellipse(1.5)`）。錠剤型のボタンに `squircle` を1行足すだけの場合は、ルール `corner-shape-guard-when-broken` に従います。'
  page: decoration/shapes
  since: 0.25.0

# 16-9 輪郭と枠線を描く
- id: guard-new-shapes-with-supports
  level: 推奨
  kind: spec
  rule: '`background-clip: border-area` の透明な枠線のように、未対応の環境で宣言ごと無効になって何も描かれなくなる指定は `@supports` の中に書く。'
  reason: 未対応の環境では、背景の宣言ごと無効になって枠線やグラフが消えたり、枠線だけが透明になったりするため。
  note: '未対応の環境では、単色の枠線や中心まで塗った円グラフのように、意味の読み取れる形に縮退させます。'
  aiProne: true
  page: decoration/outlines
  since: 0.5.0

- id: gradient-border-method
  level: 推奨
  kind: judgment
  rule: 'グラデーションの枠線は `background-clip: border-area` で描いて未対応の環境では単色の枠線に戻し、どの環境でもグラデーションが必要なときだけ、擬似要素の透明な枠線にグラデーションを敷いて `mask-composite: exclude` で内側をくり抜く。'
  reason: '`border-area` なら2つの宣言で描けて形がコードから読み取れ、装飾の枠線は単色でも境界を示せるため。'
  note: 'マスクの書き方では、ルートに `position: relative` と `isolation: isolate` を指定し、擬似要素を `z-index: var(--z--backwards)` で背面に回して、ルートの `padding` に枠線の太さを足します。`contain: content` でも配置の基準とスタッキングコンテキストは作れますが、はみ出した子孫の影やポップアップが切り取られます。'
  aiProne: true
  page: decoration/outlines
  since: 0.20.0

- id: shape-function-with-custom-properties
  level: 推奨
  kind: judgment
  rule: '`clip-path: shape()` の座標は、半径などをカスタムプロパティに入れて、そこから計算する。'
  reason: '`shape()` の値は長く、数値を直接並べると形が読み取れず、大きさを変えるたびにすべての座標を書き直すことになるため。'
  note: '`shape()` に対応していない環境には、`@supports not` で `border-radius` の形に戻します。'
  page: decoration/outlines
  since: 0.5.0

- id: shared-shape-for-border-shape
  level: 推奨
  kind: spec
  rule: '吹き出しのように枠線を輪郭に沿わせる形は、`shape()` を1つのカスタムプロパティに入れて `clip-path` と `border-shape` で共有し、`border` と `border-shape` は `@supports (border-shape: …)` の中に書く。'
  reason: '同じ輪郭を2か所に書くと片方だけ直したときに塗りと枠線がずれ、`@supports` の外の `border` は未対応の環境で `clip-path` に切り落とされて欠けた枠になるため。'
  note: 'しっぽの高さは `半幅 * tan(60deg)` で正三角形にし、下の `padding` にしっぽの高さを足します。'
  aiProne: true
  page: decoration/outlines
  since: 0.25.0

# 16-10 区切り線を引く
- id: separators-in-gap
  level: 推奨
  kind: convention
  rule: 並んだ要素の間の区切り線は、各要素の `border` ではなく、要素の間の `gap` に描く。
  reason: 折り返しや列数の変化で行の末尾に来る要素はセレクタで選べず、要素に線を持たせると、行の端に区切る相手のいない線が残ったり、隣り合う線が二重になったりするため。
  note: 'gap decorations（`column-rule`、`row-rule`）を使うか、`gap` を線の太さにして各要素の `box-shadow` を重ねます。表の枠線は `border-collapse` で共有します（11-15）。'
  aiProne: true
  page: decoration/separators
  since: 0.25.0

- id: no-last-child-border-reset
  level: 非推奨
  kind: convention
  rule: '区切り線のために各要素に `border` を付け、`:last-child` や `:nth-child()` で末尾の要素の `border` を打ち消さない。'
  reason: 打ち消せるのは並び全体の最後の要素だけで、折り返した行の末尾や、列数が変わるグリッドの末尾の列には線が残るため。
  aiProne: true
  page: decoration/separators
  since: 0.25.0

- id: gap-decorations-progressive
  level: 推奨
  kind: judgment
  rule: gap decorations は、線がなくても内容を読める区切りに使い、線がないと境界が分からないときは `box-shadow` で同じ位置に線を描いたうえで、対応している環境の改善として足す。
  reason: 対応しているのは Chrome と Edge だけで、未対応の環境では線が描かれないため。
  note: 'Grid と Flexbox の `column-rule` は、未対応の環境では無視されるだけなので、線を足すだけなら `@supports` は要りません。`box-shadow` の線と切り替えるときは `@supports not` の中に `box-shadow` を書き、強制カラーモードでは `outline` に切り替えます（ルール `no-box-shadow-only-boundary`）。'
  page: decoration/separators
  since: 0.25.0

- id: gap-decorations-supports-condition
  level: 必須
  kind: spec
  rule: 'gap decorations の対応を `@supports` で判定するときは、`column-rule` ではなく `column-rule-inset` のような gap decorations で加わったプロパティを条件にする。'
  reason: '`column-rule` はマルチカラムのプロパティとしてすべてのブラウザが対応しているので、gap decorations に未対応の環境でも条件が真になるため。'
  aiProne: true
  page: decoration/separators
  since: 0.25.0

# 16-11 印刷のスタイル
