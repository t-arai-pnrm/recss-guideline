# 第6章 値と単位

# 6-1 pxとremを使い分ける
- id: unit-by-text-scaling
  level: 必須
  kind: judgment
  rule: 単位は「ユーザーがブラウザの文字サイズを大きくしたとき、この値も一緒に大きくなるべきか」で選び、大きくなるべき値は rem（または em）、そうでない値は px にする。
  reason: 文字サイズの設定を尊重しつつ、余白や線まで大きくなって読みにくくなるのを防ぐため。
  note: すべてを rem にする書き方も、すべてを px にする書き方も、この基準に合いません。
  aiProne: true
  page: values/px-and-rem
  since: 0.1.0

- id: font-size-in-rem
  level: 必須
  kind: spec
  rule: '`font-size` は rem（要素の文字サイズに比例させるなら em）で指定し、px を使わない。'
  reason: px で指定した文字は、ブラウザの文字サイズの設定を変えても大きくならないため。
  note: '入力欄の文字サイズに `max(16px, 1rem)` のように px の下限だけを付けるのは例外です（iOS の Safari がフォーカスしたときに拡大するのを防ぐため。17-7）。px は下限にだけ使い、文字サイズの設定に追従する rem を残します。'
  aiProne: true
  page: values/px-and-rem
  since: 0.1.0

- id: text-related-sizes-in-rem
  level: 推奨
  kind: judgment
  rule: 段落の間の縦の余白、テキストを含む要素の幅、ボタンの最小の高さのように、文字と一緒に大きくなるべき寸法は rem で指定する。
  reason: 文字だけが大きくなると、段落の区切りが分かりにくくなったり、1行に入る文字数が減って窮屈になったりするため。
  note: 見出しと段落、段落どうしのような文章の中の間隔は rem にし、カードどうしやボタンどうしのような部品の間の余白は px にします。ブレイクポイントを rem で指定するのも同じ理由です（13-2）。
  page: values/px-and-rem
  since: 0.1.0

- id: padding-and-decoration-in-px
  level: 推奨
  kind: judgment
  rule: '`padding`（とくに水平方向）と、`border-width`、`box-shadow`、`outline-width`、`outline-offset` のような装飾的な値は px で指定する。'
  reason: 余白まで大きくなると1行に入る文字数がさらに減り、線や影の太さは文字の大きさと関係がないため。
  note: '`gap` や `margin` は、この基準に照らして1つずつ判断します。'
  page: values/px-and-rem
  since: 0.1.0

- id: em-for-own-font-size
  level: 推奨
  kind: judgment
  rule: アイコンの大きさ、アイコンとラベルの間の `gap`、見出しに隣接する `margin` のように、その要素自身の文字サイズに比例させたい値は em で指定する。
  reason: 大きさの違う文字の隣に置かれても、文字との比率を保てるため。
  page: values/px-and-rem
  since: 0.1.0

- id: px-to-rem-formula
  level: 推奨
  kind: convention
  rule: px の値を rem に変換するときは `calc(24 / 16 * 1rem)` のように変換の式で書き、計算した結果（`1.5rem`）を書かない。
  reason: デザインカンプのピクセル値をそのまま読み取れ、計算の手間と誤りも減るため。
  note: '`clamp()`、`min()`、`max()` の中では、`calc()` を省いて `24 / 16 * 1rem` と書けます。'
  aiProne: true
  page: values/px-and-rem
  since: 0.1.0

- id: no-root-font-size-change
  level: 禁止
  kind: judgment
  rule: '`html { font-size: 62.5% }` のように、rem の計算を簡単にする目的でルートの文字サイズを変えない。'
  reason: 16px を前提に rem で書かれた外部の CSS が崩れ、px で指定した場合はユーザーの文字サイズの設定も効かなくなるため。
  aiProne: true
  page: values/px-and-rem
  since: 0.1.0

- id: unitless-line-height
  level: 必須
  kind: spec
  rule: '`line-height` は単位のない数値で指定する。'
  reason: 単位のある値は計算後の長さのまま子要素に継承され、文字サイズの違う子要素で行が重なったり空きすぎたりするため。
  note: '見出しや本文ごとの値と、`line-height: 1` を使わない理由は第14章で扱います。例外は、インラインの要素の行ごとに座布団を敷くときに、座布団の高さから `line-height` を長さで決める場合です（16-7）。この場合は、座布団の中に文字サイズの違う子要素を置かず、理由のコメントを添えて Stylelint の警告を無効にします。'
  lint: 'Stylelint: `declaration-property-unit-allowed-list`'
  aiProne: true
  page: values/px-and-rem
  since: 0.1.0

- id: unitless-size-tokens
  level: 推奨
  kind: convention
  rule: サイズのトークンは単位のない数値（px 相当）で持ち、使う場所で `calc(var(--spacing--md) / 16 * 1rem)` や `calc(var(--spacing--md) * 1px)` に変換する。
  reason: 同じ大きさでも、使う場所によって選ぶべき単位が変わるため。
  page: values/px-and-rem
  since: 0.1.0

- id: verify-with-text-scaling
  level: 必須
  kind: judgment
  rule: rem を使ったら、ブラウザの文字サイズの設定を大きくして表示を確かめる。
  reason: 設定が効いているかどうかと、文字が大きくなったときに崩れないかどうかは、設定を変えて見なければ分からないため。
  page: values/px-and-rem
  since: 0.1.0

# 6-2 ビューポート単位とコンテナ単位
- id: no-vw-vh
  level: 禁止
  kind: judgment
  rule: '`vw`、`vh`、`vi`、`vb`、`vmin`、`vmax` を使わない。'
  reason: '縦方向の `vh` と `vb` は、ブラウザの UI が引っ込んだ最も大きい画面（ラージビューポート）が基準なので、モバイルでは UI が表示された状態で要素が見切れるため。横方向の `vw` と `vi` は、`svi` と書けば示せる「どの状態の画面に合わせるか」が、コードから読み取れないため。'
  note: '代わりに `svi` や `svb` などを使います。基準の状態を名前で示す単位（`svi`、`svb`、`lvb`、`dvb`）が本書の対象のすべてのブラウザで使えるので、禁止にしています。クラシックなスクロールバーが幅を取る環境では、ブラウザとルートの `scrollbar-gutter` の指定によって `svi` もスクロールバーの幅を含めて計算されることがあるので、画面の幅いっぱいに広げる指定はできるだけ避けます（`viewport-units-as-last-resort`）。HTML の `sizes` 属性の値は、CSS の宣言ではなく、画像を選ぶ時点のビューポートの幅を表すものなので、対象外です（16-2）。'
  lint: 'Stylelint: `unit-disallowed-list`（警告）'
  aiProne: true
  page: values/viewport-and-container-units
  since: 0.1.0

- id: prefer-svi-svb
  level: 推奨
  kind: judgment
  rule: ビューポート単位は、横方向は `svi`、縦方向は `svb` を優先する。
  reason: ブラウザの UI が表示されている最も小さい画面でも収まり、有効なコンテナがないときの `cqi` の計算（`svi`）ともそろうため。
  note: '画面の高さいっぱいの要素は `min-block-size: 100svb` と、最小の高さとして指定します。`svh` や `svw` のような物理方向の単位は、`logical-css/require-logical-units` が警告します。'
  aiProne: true
  page: values/viewport-and-container-units
  since: 0.1.0

- id: avoid-dvb
  level: 非推奨
  kind: judgment
  rule: 要素の大きさを `dvb`（`dvh`）で指定しない。
  reason: スクロールに合わせてブラウザの UI が出入りするたびに値が変わり、レイアウトシフトが起きるため。
  aiProne: true
  page: values/viewport-and-container-units
  since: 0.1.0

- id: lvb-for-fixed-background
  level: 推奨
  kind: judgment
  rule: ブラウザの UI の有無にかかわらず画面の高さいっぱいに広げたい要素（固定した背景など）には、`lvb` を使う。
  reason: UI が引っ込んだときの最大の高さを基準にするので、スクロール中にも背景が途切れないため。
  page: values/viewport-and-container-units
  since: 0.1.0

- id: viewport-units-with-media-queries
  level: 推奨
  kind: judgment
  rule: ビューポート単位は、ページ全体の余白やヒーローのようにメディアクエリと対になる値に使い、置き場所が変わるコンポーネントの中では使わない。
  reason: ビューポート単位はページ全体の状態と結びついた値で、コンポーネントが置かれた場所の幅とは関係がないため。
  note: コンポーネントの中で幅に応じて変える値は、名前付きのコンテナと `cqi` で書きます（13-3）。要素の幅と画面の幅を比べて、要素が画面のどれだけを占めるかを調べるときは、コンポーネントの中でも使います（`container-query-screen-ratio`、`full-bleed-radius-with-sign`）。
  page: values/viewport-and-container-units
  since: 0.1.0

- id: no-viewport-only-font-size
  level: 禁止
  kind: spec
  rule: '文字サイズをビューポート単位だけで決めない（`font-size: 4svi` など）。'
  reason: ユーザーの文字サイズの設定が無視され、ブラウザのズームでも文字が大きくならないため。
  note: 画面の幅に合わせて変えるなら、`clamp()` で rem と組み合わせます（6-3）。
  aiProne: true
  page: values/viewport-and-container-units
  since: 0.1.0

- id: viewport-units-as-last-resort
  level: 推奨
  kind: judgment
  rule: ビューポート単位は、`%` やイントリンシックなレイアウトで解決できないときだけ使う。
  reason: ビューポート単位だけで決めた値はブラウザのズームで拡大されず、スクロールバーの幅の扱いもブラウザによって異なるため。
  note: '`inline-size: 100vw` のように要素を画面幅いっぱいに広げる指定は、多くの場合なくても済みます。'
  page: values/viewport-and-container-units
  since: 0.1.0

- id: centralize-viewport-fluid-values
  level: 推奨
  kind: judgment
  rule: ビューポート単位を使う流体的な値をプロジェクト全体で多用するときは、その都度書かず、トークンかユーティリティにまとめる。
  reason: 基準の幅や係数が散らばらず、変えるときの修正が1か所で済むため。
  page: values/viewport-and-container-units
  since: 0.1.0

# 6-3 計算関数で根拠を式に残す
- id: formula-over-result
  level: 推奨
  kind: convention
  rule: 計算して決まる値は、計算した結果ではなく `calc()` の式で書き、値の根拠をコードに残す。
  reason: 値が何から決まったのかを読み取れ、元の値を変えたときに計算し直す必要もないため。
  note: 根拠のない値を `calc(48rem)` のように包むだけでは意味がありません。値が本当に固定で、分解しても意味が増えないなら、そのまま書きます。
  page: values/math-functions
  since: 0.1.0

- id: name-calc-operands
  level: 推奨
  kind: judgment
  rule: 式の中で意味が分かりにくい値や、何度も使う値は、ローカルのカスタムプロパティに名前を付けてから式に使う。
  reason: 式が読みやすくなり、値を変えるときの修正も1か所で済むため。
  note: 一度しか使わない複雑な式には、何列分・何個分なのかをコメントで補足します。
  page: values/math-functions
  since: 0.1.0

- id: fluid-values-with-clamp
  level: 推奨
  kind: judgment
  rule: 幅に応じて連続的に変えたい値は、クエリで段階的に切り替えず、`clamp()` で最小値と最大値の間を補間する。
  reason: クエリの数が減り、切り替わる幅の前後で値が急に変わることもなくなるため。
  note: タグやアイコンのように、大きさを変える必要のない要素には使いません（13-1）。
  page: values/math-functions
  since: 0.1.0

- id: clamp-rem-bounds
  level: 必須
  kind: spec
  rule: 文字サイズのように、ユーザーの設定に追従させる値を `clamp()` で書くときは、最小値と最大値を rem にし、推奨値を rem と相対単位（`svi` か `cqi`）の和にする。
  reason: 相対単位だけの推奨値では、文字サイズの設定やズームが効かなくなるため。
  note: ページ全体の値には `svi` を、コンポーネントの中の値には名前付きのコンテナの `cqi` を使います。
  aiProne: true
  page: values/math-functions
  since: 0.1.0

- id: clamp-from-slope-intercept
  level: 推奨
  kind: convention
  rule: '`clamp()` の推奨値は、2つの基準の幅とそのときの値から傾きと切片を求めて書き、ジェネレーターが出した数値だけを貼らない。'
  reason: 数値だけでは、どの幅でどの値になるのかを読み取れず、値を変えるときに計算をやり直せないため。
  note: 基準の幅と値は、カスタムプロパティを使った式にするか、少なくともコメントに残します。
  aiProne: true
  page: values/math-functions
  since: 0.1.0

# 要確認：Safari のズームの最大は未確認（Chrome と Firefox のデスクトップ版の500%は、2026-10 に各ブラウザのソースで確認）
- id: fluid-font-size-max-ratio
  level: 推奨
  kind: spec
  rule: '文字サイズを `clamp()` で流体的にするときは、最大値を最小値の2.5倍以内にする。'
  reason: '推奨値の相対単位の部分はブラウザのズームで大きくならないが、ズームの最大が500%の環境（Chrome と Firefox のデスクトップ版）では最小値が5倍になるので、最大値が最小値の2.5倍以内なら、どの幅でも文字を2倍以上に拡大できるため。'
  note: '2.5倍は、ズームの最大が500%の環境で文字を2倍にできる十分条件で、ズームの最大がそれより小さい環境では、より小さい比が要ります。超える場合は、最小値を上げるか最大値を下げます。WCAG 2.1 の達成基準1.4.4が求める、拡大した後も内容や機能が失われないことは、これとは別にルール `verify-text-resize-200` で確かめます。最小値と最大値を rem にするルール `clamp-rem-bounds` と組み合わせて使います。'
  aiProne: true
  page: values/math-functions
  since: 0.21.0

# 6-4 計算関数を応用する
- id: typed-arithmetic-to-unitless
  level: 推奨
  kind: convention
  rule: '長さを単位のない数値に変えるときは、`calc(100svi / 1px)` のように単位のついた値で割り（typed arithmetic）、`tan(atan2(長さ, 1px))` で単位を外さない。'
  reason: 式がそのまま割り算として読め、角度を経由する三角関数の回り道が要らないため。
  note: 'デザインカンプの値は、これまでどおり `clamp(16px, 40 / 1280 * 100svi, 40px)` のように単位のない数値で割って範囲を付け、`40px / 1280px` とは書きません。Firefoxの安定版は単位のついた値での割り算に対応していない（158で対応する予定）ので、宣言が無効になっても内容を読める場面で使います。Chromeでは、この割り算で定義した長さがブラウザのズームで拡大縮小されないので、文字サイズにはremの下限を付けます。'
  aiProne: true
  page: values/advanced-math-functions
  since: 0.11.0

# 6-5 if()とattr()で条件と属性を値にする
- id: attr-for-html-attributes
  level: 推奨
  kind: judgment
  rule: 型付きの `attr()` は、`<textarea>` の `rows` のように HTML がすでに持っている属性の値を CSS でも使うときに限り、コンポーネントに値を渡す手段は `style` 属性の公開プロパティのままにする。
  reason: 型付きの `attr()` に未対応のブラウザがあり、同じ値を属性と `style` 属性の2か所に書くことも避けられるため。
  note: '`data-variant` のように選択肢から1つを選ぶバリエーションは、属性セレクタで書きます。`attr()` の値は `url()` に使えないので、背景画像は `style` 属性の公開プロパティで渡します。'
  page: values/if-and-attr
  since: 0.5.0

- id: typed-attr-fallback
  level: 必須
  kind: spec
  rule: '`content` 以外のプロパティで `attr()` を使うときは、型と第2引数を書き、その宣言を型付きの `attr()` を条件にした `@supports` の中に書いて、外に未対応の環境で使う宣言を書く。'
  reason: '`attr()` は `var()` と組み合わせることが多く、宣言に `var()` が含まれると、未対応の環境でも宣言は計算値の時点で無効になって前の宣言に戻らないため。対応した環境でも、属性がないか型として読めないと、宣言がプロパティの初期値に戻る。'
  note: '第2引数は、対応した環境でしか使われないので、未対応の環境のフォールバックにはなりません。`@supports` の条件は `min-block-size: calc(attr(rows type(<number>), 3) * 1lh)` のように型付きで書き、`var()` を含めません。'
  aiProne: true
  page: values/if-and-attr
  since: 0.5.0

- id: if-for-own-custom-property
  level: 推奨
  kind: judgment
  rule: '`if()` は、要素自身に定義したカスタムプロパティを `style()` で調べるときにだけ使い、条件1つと `else` の形で書く。'
  reason: スタイルクエリは親の要素の値しか調べられず、それ以外の分岐は `@media`、`@supports`、状態のセレクタと接尾辞の内部プロパティで書くほうが、状態の一覧を読み取れるため。
  note: '`media()` と `supports()` は使わず、各セレクタの中の `@media` と `@supports` で書きます。例外は、1つの長さを段階ごとの値に置き換える対応表です（16-8 の `squircle` の倍率など）。状態の分岐ではないので、条件を複数並べてかまいません。'
  aiProne: true
  page: values/if-and-attr
  since: 0.5.0

- id: if-fallback-and-else
  level: 必須
  kind: spec
  rule: '`if()` を含む宣言の前に未対応の環境で使う宣言を書き、`if()` には必ず `else` の値を書く。'
  reason: 未対応の環境では `if()` を含む宣言が捨てられ、対応した環境ではどの条件も成り立たないと、前の宣言ではなく初期値か継承した値になるため。
  note: '前の宣言に戻るのは、`if()` を含む宣言に `var()` がない場合だけです。`var()` を含むと計算値の時点で無効になり、前の宣言に戻らないので、`@supports` の中に書くか、スタイルクエリや状態のセレクタで書きます。'
  aiProne: true
  page: values/if-and-attr
  since: 0.5.0

- id: space-toggle-until-if
  level: 推奨
  kind: judgment
  rule: '要素自身の2値の分岐を、`if()` に未対応の環境でも同じ表示にする必要があるときは、スペーストグル（`--_if-spacious: initial` と `--_if-compact: ;` を入れ替え、`var(--_if-spacious, 24px) var(--_if-compact, 12px)` で読む）で書き、`if()` がすべての主要なブラウザで使えるようになったら `if()` に置き換える。'
  reason: スペーストグルはすべての主要なブラウザで動くが、空白の値に意味を持たせるハックで、1つの状態に変数が2つ要り、読み手に仕組みの知識を求めるため。
  note: '2値の分岐にだけ使い、3段階の切り替えや複数の条件の組み合わせには使いません。トグルの変数はフラグ（`--_density`）と同じ `@media` の中で切り替え、子孫の要素はこれまでどおりスタイルクエリでフラグを読みます。オフの値は空白1文字にし、整形ツールや圧縮で消されないことを確かめます。未対応の環境で値が少し変わるだけで済むなら、`if()` の前に従来の宣言を書く方法（`if-fallback-and-else`）を使います。'
