# 第18章 モーション

# 18-1 動かすかどうかを決める
- id: motion-needs-purpose
  level: 推奨
  kind: judgment
  rule: アニメーションを足す前に、状態の変化や操作の結果を伝えるという目的があるかを確かめ、目的のない動きは入れない。
  reason: 何度も触る UI の装飾的な動きは、待ち時間と操作の負担を増やすだけになるため。
  note: 'その動きを見る頻度でも判断を変えます。1日に何十回も使う操作（メニュー、タブ、ツールバー）は動かさないか、押したときの縮小のような最小限の動きにとどめます。ブランドの個性を表す動きは、LP のヒーローや初回の案内のように、まれにしか見ない UI に限ります。'
  page: motion/purpose
  since: 0.1.0

- id: no-motion-on-keyboard-shortcut
  level: 禁止
  kind: judgment
  rule: キーボードショートカットで開閉する UI（コマンドパレットなど）に、出現と退場の動きを付けない。
  reason: キーを押す操作は素早く続けて行われることが多く、動きが終わるのを待つと、入力と表示がずれて反応が遅く感じられるため。
  note: 'クリックとショートカットのどちらでも開く UI は、ショートカットで開いたときに JavaScript で属性を付け、その属性があるときは `transition-duration` を0にします。キーボードでのフォーカスの移動は `no-motion-on-focus-visible` で扱います。'
  aiProne: true
  page: motion/purpose
  since: 0.21.0

- id: css-before-js-animation
  level: 推奨
  kind: judgment
  rule: 動きは CSS のトランジション、アニメーション、View Transitions、スクロール駆動アニメーションで作り、JavaScript のアニメーションライブラリは、CSS だけでは作れない動きにだけ使う。
  reason: 合成だけで動かせる CSS の動きはメインスレッドが忙しいときにも影響を受けにくいことが多く、ライブラリの読み込みと保守の負担も要らないため。
  page: motion/purpose
  since: 0.4.0

# 18-2 動きを減らす設定に対応する
- id: motion-only-with-no-preference
  level: 必須
  kind: spec
  rule: '装飾的な動きのうちフェード以外は `@media (prefers-reduced-motion: no-preference)` の中で指定する。'
  reason: 'WCAG 2.2 の達成基準2.3.3（レベル AAA）は、操作をきっかけに起きる本質的でない動きのアニメーションを無効にできることを求めており、装飾的な動きはなくても情報が欠けないため。設定がないときにだけ動きを付ければ、動きを減らす設定をしているユーザーに、めまいや吐き気の原因になる動きを見せずに済むため。'
  note: 'WCAG の「動きのアニメーション」には、要素の大きさ、形、位置が変わって見えない色や不透明度の変化は含まれないので、位置と大きさの変わらないフェードは条件の外に書いてかまいません。全称セレクタと `!important` で全体の動きを止める書き方には頼りません。機能的な動きの扱いは `simplify-large-motion-when-reduced` で定めます。'
  aiProne: true
  page: motion/reduced-motion
  since: 0.1.0

- id: simplify-large-motion-when-reduced
  level: 必須
  kind: judgment
  rule: 機能的な動きでも大きな変動は、動きを減らす設定のときにフェードへ置き換える。
  reason: 状態の変化や操作の結果を伝える動きでも、多くは WCAG 2.3.3 の「本質的な動き」（その動きがないと機能や情報が成り立たないもの）にあたらず、フェードでも同じ情報を伝えられるため。フェードは位置と大きさが変わらないので、WCAG 2.3.3 の「動きのアニメーション」を無効にしたことになる。
  note: '大きな変動は、本書の目安では、画面の3分の1以上を占める要素の移動、画面の3分の1以上の範囲で切り抜きを変える動き、回転を伴う動き（スピナーを除く）、`scale` の変化量が0.5以上の拡大や縮小、スクロールに合わせた変形、揺れる動きです。WCAG が定める基準ではなく、目安を下回れば配慮が要らないという意味でもありません。再生時間を短くする対応（本書の目安は50ms以下）は、位置と大きさが変わらない動き（フェード）に限ります。AAA を目標にしないサイトで、移動や拡大を短くして残す場合は、動きが残るので WCAG 2.3.3 を満たしません。AAA に適合させるなら、本質的でない移動や拡大は、大きさを問わず無効にするか、フェードへ置き換えます。スピナー、プログレスバー、フォーカスリングの表示は変えません。'
  aiProne: true
  page: motion/reduced-motion
  since: 0.40.0

# 18-3 イージングと再生時間
- id: scale-in-from-near-one
  level: 必須
  kind: judgment
  rule: '拡大して現れる動きは `scale: 0` から始めず、ツールチップとポップオーバーは0.95〜0.98、ドロップダウンメニューは0.92〜0.96、ダイアログやドロワーは0.85〜0.92から始め、`transform-origin` をトリガーのある側に向ける。'
  reason: 何もないところから膨らむ動きは物理的に不自然で、起点が中央のままだと、どこから現れたのかが伝わらないため。
  aiProne: true
  page: motion/easing-and-duration
  since: 0.15.0

- id: no-ease-in-for-ui
  level: 非推奨
  kind: judgment
  rule: 'UI の出現、退場、移動に、`ease-in` や `in` 系のイージング（だんだん速くなる動き）を使わない。'
  reason: 動き始めの変化が小さいので操作してから反応が見えるまでが遅れて感じられ、最も速い状態のまま急に止まるので物理的にも不自然に見えるため。
  note: '現れる動きと消える動きには `out` 系、画面の上にあるものの移動には `in-out` 系のトークンを使います。本書のイージングのトークンには、`in` 系を用意していません。加速していく様子そのものを見せたい演出のように、理由がある場合は使ってかまいません。'
  aiProne: true
  page: motion/easing-and-duration
  since: 0.21.0

- id: linear-only-for-constant-motion
  level: 推奨
  kind: judgment
  rule: '`linear` のイージングは、マーキーやプログレスバーのように一定の速さで続く動きにだけ使い、UI の状態の変化には使わない。'
  reason: 速さが変わらない動きは機械的に見え、始まりと終わりが唐突に感じられるため。
  note: 長押しで確定するボタンの進み具合は、押し続けた時間に比例して進むプログレスバーなので、押している間の広がりに `linear` を使います。離したときは、判定と同じく進み具合を0に戻すので、トランジションを付けません。
  page: motion/easing-and-duration
  since: 0.15.0

- id: functional-motion-under-300ms
  level: 必須
  kind: judgment
  rule: 操作に応じる機能的な動きの再生時間は300ms以下にし、ダイアログ、ドロワー、シートのように画面の大部分を覆う UI でも500ms以下にする。
  reason: 動きが終わるまで次の操作を待たせず、1日に何度も触る UI でも待ち時間が積み重ならないようにするため。
  note: '例外は、スクロールで画面に入ったときに一度だけ再生する演出の `--duration--reveal`（600ms）と、ばねの動きの `--duration--spring`（700ms）です。どちらも頻繁に触る UI には使いません。長押しで確定するボタンの進み具合（2秒前後）は、動きの速さではなく確定までに押し続ける時間を表すので、この上限の対象外です。ツールチップの表示を遅らせる `transition-delay` は、再生時間に含めません。'
  aiProne: true
  page: motion/easing-and-duration
  since: 0.21.0

- id: press-feedback-short
  level: 推奨
  kind: judgment
  rule: 'ボタンを押したことを動きで返すときは、`:active` で `scale` を0.96〜0.98に縮め、再生時間を100〜150msにする。'
  reason: 押したことがすぐに伝わり、短い動きなら続けて押す操作の妨げにならないため。
  note: 押したことを伝える必要がある UI にだけ使います。
  page: motion/easing-and-duration
  since: 0.15.0

- id: spring-easing-token
  level: 推奨
  kind: judgment
  rule: ばねやバウンスの動きは、`linear()` をジェネレーターで作り、再生時間とセットでトークンにして、コンポーネントに値を直接書かない。
  reason: 点の数が多く手で保守できず、トークンにすれば、揺れが収まるまでの時間とイージングを対で使い回せるため。
  note: '揺れが収まるまでの時間が要るので、機能的な動きの上限（300ms）を超えます。頻繁に触る UI には使わず、`prefers-reduced-motion: no-preference` の中でだけ指定します。`opacity` には使いません。0〜1の範囲を超えた値が丸められ、揺れが明滅になるためです。'
  page: motion/easing-and-duration
  since: 0.4.0

# 18-4 トランジションの基本と中断
- id: no-transition-all
  level: 禁止
  kind: judgment
  rule: '`transition: all` や `transition-property: all` を使わない。'
  reason: 関係のないプロパティまで動き、意図しないアニメーションや無駄な描画の負荷を生むため。
  aiProne: true
  page: motion/transitions-and-keyframes
  since: 0.1.0

- id: transition-longhand-with-tokens
  level: 推奨
  kind: convention
  rule: トランジションは `transition-duration`、`transition-property`、`transition-timing-function` のロングハンドで書き、再生時間とイージングにはトークンを使う。
  reason: 動かすプロパティが一目で分かり、サイトの中で動きの速さと質感がそろうため。
  note: '`transition-behavior: allow-discrete` も、略記の `transition` に含めず、ロングハンドで書きます。略記に入れると、`allow-discrete` を解釈できないブラウザでは宣言全体が無効になり、ほかのプロパティのトランジションまで失われるためです。'
  page: motion/transitions-and-keyframes
  since: 0.1.0

- id: interruptible-with-transition
  level: 推奨
  kind: judgment
  rule: 操作の途中で取り消されることがある動きは `@keyframes` ではなくトランジションで書き、タブやセグメンテッドコントロールのように続けて押される UI では、再生時間を100〜150msにするか、動きを省く。
  reason: トランジションは途中の状態から逆向きに戻るが、`@keyframes` のアニメーションは途中で止めると値が飛び、続けて押すと動きが操作に追いつかないため。
  page: motion/transitions-and-keyframes
  since: 0.15.0

# 18-5 トランジションを応用する
- id: transition-duration-per-direction
  level: 推奨
  kind: convention
  rule: '状態に入るときと外れるときで再生時間を変えるなら、基本のルールに長い再生時間を、入る側の状態のルールに短い再生時間を書く。入る側の再生時間も `prefers-reduced-motion: no-preference` の中に書く。'
  reason: 反応の速さと、戻るときの自然さを両立できるため。`transition-property` の初期値は `all` なので、条件の外に書くと、動きを減らす設定でもすべてのプロパティが動くため。
  note: 'どちらの再生時間もトークンから選びます。例外は、長押しで確定するボタンの進み具合のように、入る側の動きが押し続けた時間そのものを表す場合です。このときは入る側の状態にだけ、確定までの時間（トークンの段階にない値なので、公開用のカスタムプロパティで受け取る）と `linear` を書き、基本のルールにはトランジションを書きません。離したら、判定と同じく進み具合を0に戻すためです。確定は表示のトランジションではなく JavaScript のタイマーで判定し、ボタンの上で離したときに行います。進み具合は確定に要る情報なので、動きを減らす設定でも残し、`transition-property` を絞ったうえで条件の外に書きます。'
  page: motion/transition-techniques
  since: 0.4.0

# 18-6 @keyframes を設計する
- id: animation-longhand-fill-mode
  level: 推奨
  kind: convention
  rule: 'アニメーションは `animation` の略記ではなく、`animation-name` などのロングハンドで書き、`animation-fill-mode` は `both` を第一候補にする。'
  reason: 略記は `animation-timeline` と `animation-range` もリセットするため。また、`both` にしないと、遅延の間は開始前の見た目のままで、終わった瞬間にもとの値へ戻り、見た目が飛ぶため。
  note: '`transition-longhand-with-tokens` と対になるルールです。'
  page: motion/keyframes
  since: 0.4.0

- id: keyframes-single-property
  level: 推奨
  kind: convention
  rule: グローバルな `@keyframes` は1つにつき1つのプロパティだけを変え、複数の動きは `animation-name` のカンマ区切りで組み合わせる。
  reason: プロパティごとに再生時間とイージングを選び分けられ、単体でも再利用できるため。
  aiProne: true
  page: motion/keyframes
  since: 0.1.0

- id: keyframes-omit-obvious-frame
  level: 推奨
  kind: judgment
  rule: '`@keyframes` の自明な `from` や `to` は省略し、要素がもともと持っている値に向けて（または、その値から）動かす。'
  reason: 値を書き込むと、要素の実際の値と食い違ったときに、動きの始めや終わりで値が飛ぶため。
  aiProne: true
  page: motion/keyframes
  since: 0.1.0

- id: keyframes-api-properties
  level: 推奨
  kind: convention
  rule: 動きの起点や方向を変えたいときは、`@keyframes` の中で `--<keyframes の名前>--<値の名前>` のカスタムプロパティを参照し、使う側から値を渡す。
  reason: 同じ `@keyframes` を、起点や方向だけを変えて使い回せるため。
  note: '例：`--translate-from` の中で `var(--translate-from--y-value, 0)` を参照し、使う側で `--translate-from--y-value: 24px` を指定します。'
  page: motion/keyframes
  since: 0.1.0

- id: keyframes-local-naming
  level: 推奨
  kind: convention
  rule: 中間のフレームを持つものや、複数のプロパティを同時に動かす `@keyframes` は、コンポーネントの CSS に `--<コンポーネント>--<動きの名前>` の名前で定義する。
  reason: 特定の UI に結びついた動きをグローバルに置かず、名前の衝突も防げるため。
  page: motion/keyframes
  since: 0.1.0

# 18-7 出現と退場
- id: starting-style-for-entry
  level: 推奨
  kind: judgment
  rule: '`display: none` から表示する要素の出現と退場は、`@starting-style` と `transition-behavior: allow-discrete` で動かす。'
  reason: JavaScript でクラスを付け外しするタイミングを調整しなくても、CSS だけで出現と退場の両方を動かせるため。
  note: '`@starting-style` は、開いた状態のセレクタの中に書きます。'
  aiProne: true
  page: motion/entry-and-exit
  since: 0.1.0

- id: starting-style-not-overridden
  level: 推奨
  kind: spec
  rule: '`@starting-style` で動かすプロパティは、詳細度の高い規則やインラインスタイルで指定しない。`@starting-style` は元の規則の中に書く。出現だけを動かすなら `@keyframes` の `from` を使う。'
  reason: '`@starting-style` の宣言は通常のカスケードで競い合い、より強い指定があると開始値にならず、トランジションが起きないため。'
  note: '`!important` や詳細度を上げるセレクタで解決しようとしません。ほかの状態のスタイルまで上書きしてしまうためです。`@keyframes` の値は通常の宣言より優先されます。'
  aiProne: true
  page: motion/entry-and-exit
  since: 0.4.0

# 18-9 スクロールに合わせて動かす
- id: scroll-linked-method
  level: 推奨
  kind: judgment
  rule: スクロール位置に合わせて連続して変わる動きはスクロール駆動アニメーションで、画面に入ったときに1回だけ動かす演出は `view()` のタイムラインで切り替えたカスタムプロパティを `@container style()` で問い合わせて作り、`scroll` イベントで毎回位置を計算しない。
  reason: スクロールのたびに位置を計算する処理はメインスレッドを占有し、動きがかくつく原因になるため。
  note: 'Firefox でも演出を出したい場合と、スクロールを戻しても再生を途中で止めたくない場合は、`IntersectionObserver` で属性を切り替えます。1回だけ動かす演出を CSS だけで書く `timeline-trigger` と `animation-trigger` は、Chrome 系のブラウザだけが対応しています。'
  aiProne: true
  page: motion/scroll-driven
  since: 0.1.0

- id: reveal-once-with-style-query
  level: 推奨
  kind: judgment
  rule: '画面に入ったら1回だけ再生する演出は、ルートの `view()` のタイムラインで登録していないカスタムプロパティを `--false` から `--true` に切り替え、子の一時停止したアニメーションを `@container style(--_in-view: --true)` の中で `running` にし、全体を `@supports (animation-timeline: view()) and (animation-range: entry)` と `@media screen` で囲む。'
  reason: 見た目の変化を時間で進むアニメーションで再生するので、スクロールを止めた位置で途中のまま残らず、スクロール駆動アニメーションに対応していない環境と、印刷のようにスクロールしない媒体では、演出なしで内容を表示できるため。
  note: '登録していないカスタムプロパティは、キーフレームの50%の時点で切り替わるので、`animation-timing-function: linear` なら範囲の中間（`entry 0% entry 60%` なら `entry 30%`）で再生が始まります。`entry 30%` は `entry` の範囲の30%で、要素が表示領域より小さいときは要素の30%が入った位置ですが、要素が表示領域より大きいときは要素全体の30%を意味しません。範囲を過ぎても値を残すために `animation-fill-mode: both` を指定します。スタイルクエリは自分の値を問い合わせられないので、切り替える要素と再生する要素を分けます。範囲より手前まで戻すと一時停止し、再生の途中なら、その位置で止まります。'
  aiProne: true
  page: motion/scroll-driven
  since: 0.20.0

- id: scroll-animation-explicit-range
  level: 推奨
  kind: judgment
  rule: スクロール駆動アニメーションは、`animation-range` で範囲を明示する。
  reason: 指定しないと `view()` では `cover`（画面に入り始めてから出終わるまで）の全体になり、見せたいタイミングとずれやすいため。
  note: '`entry`、`exit`、`contain` で範囲を絞るときは、範囲の前後の見た目のために `animation-fill-mode: both` も指定します。対応を確かめる `@supports` は、`(animation-timeline: view()) and (animation-range: entry)` のように `animation-range` も条件に加えます。'
  page: motion/scroll-driven
  since: 0.4.0

- id: motion-mode-attribute
  level: 推奨
  kind: judgment
  rule: JavaScript で動かす演出の準備のスタイルは、JavaScript が準備（監視の開始やライブラリの読み込み）を終えてルートに `data-motion-mode="motion"` を付けたときだけ当て、基本のスタイルは動かないときの最終状態として書く。
  reason: JavaScript が動かない環境や、動きを減らす設定をしている環境でも、すべての内容を読めるようにするため。
  page: motion/scroll-driven
  since: 0.1.0

# 18-10 動きの負荷を抑える
- id: animate-composite-properties
  level: 推奨
  kind: judgment
  rule: '動かすプロパティは `opacity` と変形（`translate`、`scale`、`rotate`）を優先し、`clip-path`、`background-color`、`filter` は描き直しが起きないことを確かめたうえで使い、`inline-size` や `inset` のようにレイアウトが変わるプロパティは避ける。'
  reason: '`opacity` と変形のアニメーションは、レイアウトと描き直しが起きず、進行もコンポジタのスレッドで計算されるので、メインスレッドが忙しいときにも滑らかに動くため。`clip-path`、`background-color`、`filter` で描き直しを避けられるかは、ブラウザと値によって変わる。'
  note: '影を動かすときは、`box-shadow` ではなく `filter: drop-shadow()` を動かします（`no-animate-layered-shadow`）。Chrome では、`clip-path`（角丸を付けて大きさ0から動かす場合を除く）、`background-color`、`filter` のアニメーションで描き直し（DevTools の Paint）は起きませんでした。ただし、`drop-shadow()` と `blur()` は、進行の計算がメインスレッドに残ります。描き直しが起きなくても、GPU でフィルターを当てる処理の負荷は残ります。`color`、`border-color`、`box-shadow` はペイントが起きるので、小さい要素の短い変化に限ります。アコーディオンの高さのように、ほかに方法のない場合は例外です。`will-change` は CSS に書いたままにしません（`will-change-temporarily`）。'
  page: motion/performance
  since: 0.1.0

- id: will-change-temporarily
  level: 必須
  kind: judgment
  rule: '`will-change` は CSS に書いたままにせず、どうしても必要なときだけ、動きの直前に JavaScript で付けて、終わったら外す。'
  reason: 指定し続けると合成レイヤーが作られたままになり、GPU のメモリを無駄に使うため。
  note: 外す処理は `transitionend` だけでなく `transitioncancel` にも登録します。動きを減らす設定などでトランジションが起きないときは付けません。
  aiProne: true
  page: motion/performance
  since: 0.15.0

- id: content-visibility-with-intrinsic-size
  level: 推奨
  kind: spec
  rule: '`content-visibility: auto` は最初の画面より下にある大きなブロックにだけ指定し、`contain-intrinsic-block-size: auto <長さ>` を組で書く。'
  reason: 描画を省いている間は中身の大きさが0として扱われるので、見積もりの大きさがないとスクロールバーの長さとスクロールの位置が飛ぶため。`auto` を付けると、一度描画したあとは実際の大きさを覚えて使うため。
  note: '物理の `contain-intrinsic-size` や `contain-intrinsic-height` ではなく、論理の `contain-intrinsic-block-size` を使います。ページ内検索、Tab キーでの移動、スクリーンリーダーの読み上げで中身に届くかを確かめます。閉じたパネルのように、見つかるまで隠しておく中身には `hidden="until-found"` を使います。'
  aiProne: true
  page: motion/performance
  since: 0.21.0

# 18-11 View Transitions で画面の切り替えをつなぐ
- id: view-transition-name-unique
  level: 禁止
  kind: spec
  rule: 同時に表示される複数の要素に、同じ `view-transition-name` を付けない。
  reason: 名前が重複すると撮影に失敗し、ほかの要素やページ全体の動きも含めて、切り替え全体のアニメーションが行われなくなるため。
  note: 固定の名前は、ページに1つしかない要素にだけ付けます。
  aiProne: true
  page: motion/view-transitions
  since: 0.3.0

- id: view-transition-match-element
  level: 推奨
  kind: judgment
  rule: '同じページの中の切り替えで、並んだ要素を1つずつ動かすときは、連番の名前を振らず、`view-transition-name: match-element` と `view-transition-class` を組み合わせる。'
  reason: 名前の管理をブラウザに任せられ、動きの指定も `::view-transition-group(.<クラス>)` の1か所にまとめられるため。
  note: '`match-element` はページ間の遷移では使えないので、ページ間でつなぐ要素には、前後のページで同じ名前を明示的に付けます。`view-transition-class` だけでは要素は個別に撮影されません。'
  aiProne: true
  page: motion/view-transitions
  since: 0.3.0
