# 第4章 カスケードを制御する

# 4-1 カスケード・詳細度・継承
- id: order-by-layer-not-specificity
  level: 推奨
  kind: judgment
  rule: スタイルの優先順位は詳細度の高さで決めず、レイヤーの順番と書く順番で決める。
  reason: 詳細度で優先順位を決めると、上書きのたびにセレクタが重くなり、後から誰も上書きできなくなるため。
  note: ベーススタイルは `base` レイヤーに素のセレクタで書き、コンポーネントの中はクラス1つ分（0.1.0）を基本にそろえます。レイヤーを使えない場合は、ベーススタイルを `:where()` で詳細度0にします。
  page: cascade/cascade-basics
  since: 0.1.0

- id: no-important-for-specificity
  level: 禁止
  kind: judgment
  rule: 詳細度や読み込み順の競争に勝つ目的で `!important` を使わない。
  reason: 'スタイルの宣言どうしでは `!important` を打ち消せるのは `!important` だけなので、上書きのたびに `!important` が増えていくため。'
  note: 'レイヤーを使えない既存のサイトで、壊れた既存の CSS から新しいコンポーネントを切り離すときの `all: revert-layer !important` は、この禁止の対象外です（`revert-layer-isolation-for-legacy`）。'
  aiProne: true
  page: cascade/cascade-basics
  since: 0.1.0

- id: important-only-for-guarantees
  level: 推奨
  kind: judgment
  rule: '`!important` は、`[hidden]` を確実に隠す、CMS が要素に出力する `style` 属性を打ち消すなど、ほかの手段では実現できない場面に限って使う。'
  reason: どのような上書きにも負けてはいけない指定だけに絞れば、`!important` 同士の競争が起きないため。
  note: レイヤーの中の `!important` は、前のレイヤーほど強くなります。ユーティリティは `utilities` レイヤーに置けば、`!important` なしで勝ちます。
  page: cascade/cascade-basics
  since: 0.1.0

- id: inherit-from-root
  level: 推奨
  kind: judgment
  rule: '`color` や `font-size` のように継承されるプロパティは、`:root` やコンポーネントのルートでまとめて指定し、子要素では継承を使う。'
  reason: 同じ値を子要素ごとに指定し直すと、ルートの値を変えたときに直す場所が増えるため。
  page: cascade/cascade-basics
  since: 0.1.0

- id: explicit-rollback-keyword
  level: 推奨
  kind: judgment
  rule: 値を戻すときは、`initial`、`unset`、`revert`、`revert-layer` のうち、戻したい先に合うキーワードを選んで書く。
  reason: 具体的な値を書き直すより、どこまで戻したいのかという意図がコードに残るため。
  note: '`display: initial` は、要素の種類に関係なく `inline` になります。ブラウザのデフォルトスタイルに戻すなら `revert` を使います（`revert` はサイトの CSS の指定を取り除くので、ユーザーのスタイルがあればその値になります）。'
  page: cascade/cascade-basics
  since: 0.1.0

- id: no-all-unset
  level: 非推奨
  kind: spec
  rule: 'プロパティをまとめて戻すときに `all: unset` を使わず、レイヤーを使うなら `all: revert-layer`、使わないなら `all: revert` を指定する。'
  reason: '`unset` は継承されないプロパティを初期値に戻すので、`display` が `inline` になり、ブラウザのデフォルトスタイルのうち必要なものまで消えるため。'
  aiProne: true
  page: cascade/cascade-basics
  since: 0.5.0

# 4-2 セレクタで詳細度を設計する
- id: no-id-selector
  level: 禁止
  kind: judgment
  rule: ID セレクタでスタイルを指定しない。
  reason: 詳細度が 1.0.0 になり、クラスをいくつ重ねても上書きできなくなるため。
  note: id 属性は、JavaScript から参照するとき、ARIA の属性で参照するとき、ページ内リンクの移動先にするときに限って使います。
  lint: 'Stylelint: `selector-max-id`'
  aiProne: true
  page: cascade/selectors
  since: 0.1.0

- id: no-specificity-hacks
  level: 禁止
  kind: judgment
  rule: '上書きのために、`.a.a`、`.a[class]`、`.a:not(#_)` のような詳細度を上げるためだけのセレクタや、祖先やタイプセレクタを足したセレクタを書かない。'
  reason: 意図がコードから読み取れず、次の上書きでさらに詳細度を上げる必要が生まれるため。
  note: 上書きが必要になったら、レイヤーの順番、`:where()`、公開カスタムプロパティで解決できないかを先に検討します。
  aiProne: true
  page: cascade/selectors
  since: 0.1.0

- id: minimal-selectors
  level: 推奨
  kind: judgment
  rule: 'セレクタには、外すと選ぶ要素が変わる部分だけを書く。クラスで選べる要素にタイプセレクタを連結したり（`a.nav-link`）、選ぶ要素が変わらない祖先を足したりしない。'
  reason: '要素を選ぶ役に立たない部分は、詳細度を上げ、HTML の構造への依存を増やすだけで、要素の種類や置き場所を変えたときにセレクタが当たらなくなるため。'
  note: '状態の擬似クラスや、同じクラスの要素を置き場所で区別する祖先のように、外すと意味が変わる部分は必要な部分です。上書きのために部分を足す書き方は、ルール `no-specificity-hacks` で禁じています。'
  page: cascade/selectors
  since: 0.50.0

- id: where-for-base-selectors
  level: 必須
  kind: convention
  rule: '`@layer` を使えない場合に限り、ベーススタイルのセレクタを `:where()` で包み、詳細度を 0 にする（例：`:where(a:any-link)`）。'
  reason: 'レイヤーがなければ優先順位が読み込む順番と詳細度だけで決まり、`a:any-link`（0.1.1）のような指定をクラス1つでは上書きできなくなるため。'
  note: '`@layer` を使う場合は、ベーススタイルを `base` レイヤーに素のセレクタ（`a:any-link`、`:focus-visible`、`:root:has(:modal)` など）で書きます。後のレイヤーの指定は詳細度に関係なく勝つので、コンポーネントのクラス1つで上書きできます。リセット CSS の kiso.css が `:where()` で書かれているのは、レイヤーなしでも使える配布物だからです。上書きされる前提のデフォルト値（リセットで消した `list-style-type` を戻す `:where(ul, ol)` など）は、`@layer` や `@scope` の中でも `:where()` で詳細度を 0 にしてかまいません（`is-for-state-selectors`）。'
  aiProne: true
  page: cascade/selectors
  since: 0.1.0

- id: is-keeps-highest-specificity
  level: 推奨
  kind: spec
  rule: '`:is()`、`:not()`、`:has()` の引数には、詳細度の高いセレクタを混ぜない。'
  reason: これらの擬似クラスの詳細度は、引数の中でいちばん高いセレクタの詳細度になるため。
  note: 'まとめたいだけで詳細度を加えたくないときは、`:where()` を使います。ただし、状態のセレクタは詳細度を残すために `:is()` でまとめます（ルール `is-for-state-selectors`）。'
  page: cascade/selectors
  since: 0.1.0

- id: is-for-state-selectors
  level: 推奨
  kind: spec
  rule: '状態のセレクタ（`:hover`、`:focus-visible`、`:checked`、`[aria-expanded="true"]`、`[open]` など）は `:where()` で包まず、まとめたいときは `:is()` を使う。'
  reason: 状態のスタイルは既定の見た目より優先されるべきで、`:where()` で詳細度を 0 にすると、同じ要素の既定のスタイルに書く順番しだいで負けるため。
  note: '`:where()` は、`@layer` を使えない場面のベーススタイルと、上書きされる前提のデフォルト値に使います。'
  aiProne: true
  page: pseudo/is-where-not
  since: 0.23.0

- id: is-for-ancestor-context
  level: 推奨
  kind: convention
  rule: '祖先の状態によって変わるスタイルは、子のルールの中に `&:is(<祖先のセレクタ> *)` の形で書く。'
  reason: ひとつの要素のスタイルがひとつのルールにまとまり、ネストのセレクタを `&` で始める規約とも両立するため。
  note: '例：`&:is(:scope[open] *)` は、スコープのルートの `<details>` が開いているときだけ当てはまります。祖先のホバーとフォーカスで変わる見た目は、この形ではなく `hocus-via-style-query` に従い、`--_hocus` のフラグをスタイルクエリで問い合わせます。'
  page: cascade/selectors
  since: 0.1.0

# 4-3 カスケードレイヤーで順位を決める
- id: layer-order-declaration
  level: 必須
  kind: convention
  rule: レイヤーの順序は、読み込むCSSの先頭で `@layer tokens, reset, base, vendors, compositions, pages, components, patterns, utilities;` と宣言する。
  reason: レイヤーの順番は最初に現れた順で決まるので、先頭で宣言すれば `@import` やスタイルを書く順番に左右されなくなるため。
  aiProne: true
  page: cascade/layers
  since: 0.1.0

- id: import-into-layer
  level: 推奨
  kind: convention
  rule: 'ファイル単位でレイヤーに入れるときは、`@import url("…") layer(<レイヤー>);` で割り当てる。'
  reason: どのファイルがどのレイヤーに入るのかを1か所で確認でき、各ファイルの中に `@layer` を書かずに済むため。
  page: cascade/layers
  since: 0.1.0

- id: import-resolved-at-build
  level: 必須
  kind: judgment
  rule: '`@import` は、フレームワークや PostCSS のプラグインなどでビルド時に展開し、ブラウザで実行させない。'
  reason: 'ブラウザは `@import` を書いたファイルを読み込んで解析するまで次の読み込みを始められず、読み込みが直列になって最初の表示が著しく遅れるため。'
  note: 'Astro（Vite）は `@import` をビルド時に展開し、`layer()` の指定も `@layer` のブロックとして残します。CMS と共存する案件でも、自分で書いた CSS はビルドを通してから配信します。「最小の構成で始める」のように、学習や検証のためにビルドせずに手元で試す場合は除きます。'
  aiProne: true
  page: cascade/layers
  since: 0.21.0

- id: declared-layer-names-only
  level: 必須
  kind: convention
  rule: '`@layer` と `@import` の `layer()` には、先頭の `@layer` 文で宣言した9つのレイヤー名だけを使う。'
  reason: 宣言していない名前はエラーにならず、最後に宣言したレイヤーより後ろに新しいレイヤーとして作られるので、打ち間違えると順番が崩れるため。
  note: 既存の CSS から新しいコンポーネントを切り離すときに、レイヤーの中に作る名前のない入れ子のレイヤー（`revert-layer-isolation-for-legacy`）は対象外です。
  lint: 'Stylelint: `layer-name-pattern`'
  page: cascade/layers
  since: 0.3.0

- id: third-party-in-vendors
  level: 推奨
  kind: convention
  rule: 自分で読み込むサードパーティのCSSは、`@import url("…") layer(vendors);` で `vendors` レイヤーに入れる。
  reason: レイヤーの外に置くとどのスタイルよりも強くなり、自分のコンポーネントから上書きできなくなるため。
  page: cascade/layers
  since: 0.1.0

- id: no-unlayered-styles
  level: 禁止
  kind: spec
  rule: レイヤーを使うプロジェクトでは、`@layer` の外にスタイルを書かない。
  reason: レイヤーの外のスタイルは詳細度に関係なくすべてのレイヤーに勝つので、決めた順番が崩れるため。
  page: cascade/layers
  since: 0.1.0

- id: layer-by-role
  level: 推奨
  kind: convention
  rule: ページ固有のセクションは `pages` レイヤーに、複数の場所で使うコンポーネントは `components` レイヤーに書く。
  reason: レイヤーの役割とファイルの置き場所が対応し、クエリの選び方（ページはメディアクエリ、コンポーネントはコンテナサイズクエリ）もそろうため。
  page: cascade/layers
  since: 0.1.0

- id: no-layers-with-unlayered-css
  level: 必須
  kind: spec
  rule: CMS のように、レイヤーに入っていない外部のCSSと共存する環境では `@layer` を使わず、9つの分類はディレクトリ構成と `@import` の順番で保つ。
  reason: レイヤーの外のCSSは詳細度に関係なくレイヤーの中のCSSに勝つので、自分のCSSだけをレイヤーに入れると構造的に負けるため。
  note: 判断の基準は「外部のCSSを自分で読み込み、レイヤーに入れられるかどうか」です。壊れた既存のCSSから新しいコンポーネントを切り離すときに限り、`revert-layer-isolation-for-legacy` の書き方でレイヤーを使ってよいです。
  aiProne: true
  page: cascade/layers
  since: 0.1.0

- id: revert-layer-isolation-for-legacy
  level: 推奨
  kind: judgment
  rule: '直せない既存のCSSがコンポーネントに流れ込むときは、レイヤーの中でコンポーネントの要素すべてに `all: revert-layer !important` を指定し、コンポーネント自身のスタイルは同じレイヤーの入れ子の無名レイヤーに書く。'
  reason: '`!important` どうしではレイヤーの順番が逆になるので、レイヤーの外のスタイルを詳細度や `!important` に関係なく遮断でき、入れ子のレイヤーの値だけを戻せるため。'
  note: 後ろのレイヤーやユーティリティクラスに加え、同じレイヤーの親が付けた配置（`grid-area`、外側の `margin`）と、レイヤーの外のリセット CSS の指定（`box-sizing` など）も外れるので、要るものは入れ子のレイヤーで書き直します。`style` 属性に `!important` を付けた指定は防げません。`all` はカスタムプロパティを戻さず、`:scope` と `*` は擬似要素を選ばないので、継承する値に加え、書き換えられたトークンや擬似要素への指定は別に考えます。既存のCSSを直せるなら、そちらを先に検討します。
  page: cascade/layers
  since: 0.5.0

# 4-4 @scope でスタイルを閉じ込める
- id: scope-with-donut
  level: 必須
  kind: convention
  rule: コンポーネントのスタイルは、`@scope (.scoped.<名前>) to (.scoped)` の中に書く。
  reason: スタイルの範囲がコンポーネントの中に限られ、入れ子になった別のコンポーネントにも届かないので、子要素に短い名前を付けてもぶつからないため。
  note: 'ページ固有のスタイルも、`@scope (.scoped.page-<スラッグ>) to (.scoped)` の同じ形で書きます。例外は3つです。カスタム要素で作る部品は、要素名を前置きにして `@scope (<要素名>.scoped) to (.scoped)` と書きます（`custom-element-as-scope-root`）。Shadow DOM の中の CSS では `@scope` を使いません（`shadow-dom-host-and-element-selectors`）。CMS の WYSIWYG が出力する本文エリアは `@scope (.wysiwyg)` で書き、独自のブロックの手前を下限にします（`wysiwyg-scope-root`、`wysiwyg-scope-exception`）。'
  aiProne: true
  page: cascade/scope
  since: 0.1.0

# 4-5 CSSネストの基礎
- id: nesting-read-as-is
  level: 推奨
  kind: spec
  rule: 'ネストしたセレクタの意味と詳細度は、`&` を親のセレクタリストを包んだ `:is()` に置き換えて確かめ、Sass の展開結果として読まない（`.news, #pickup { & ._title {} }` は `:is(.news, #pickup) ._title`）。'
  reason: '素の CSS のネストは文字列の展開ではなく、`&` が `:is()` と同じ決まり方で一致と詳細度を決めるので、Sass の展開結果で読むと、当たる要素や詳細度を取り違えるため。'
  note: '`.a .b { .c & {} }` は `.c :is(.a .b)` になり、Sass の `.c .a .b` と違って、`.a .c .b` の並びにも当てはまります。親が1つのセレクタなら、詳細度は展開した結果と同じです。`&__title` のように `&` に文字をつなげる書き方は無効です（第9章のルール `no-nesting-concatenation`）。'
  aiProne: true
  page: cascade/nesting
  since: 0.20.0

# 4-6 カスタムプロパティの基礎
- id: no-cascade-fallback-for-var
  level: 非推奨
  kind: spec
  rule: '`var()` を使う宣言の前に同じプロパティの値を書いて、フォールバックの代わりにしない。'
  reason: '`var()` を含む宣言は、置き換えた後に無効と分かっても前の宣言に戻らず、計算値の時点で無効になって `unset` と同じ結果になるため。'
  note: '参照先が未定義のときの値は、`var()` の2つ目の引数に書きます。2つ目の引数が使われるのは、未定義などで参照先が保証された無効値のときで、合わない値が入っているときには使われません。未対応の関数と `var()` を組み合わせるときは `@supports` の中に書き（第1章のルール `fallback-method-by-invalidation`）、値の型を保証したいカスタムプロパティは `@property` で登録します（「10-5 公開プロパティと内部プロパティ」）。'
  aiProne: true
  page: cascade/custom-properties-basics
  since: 0.65.0
