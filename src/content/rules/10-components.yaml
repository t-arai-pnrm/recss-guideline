# 第10章 コンポーネントとカスタムプロパティ

# 10-1 何をコンポーネントにするか
- id: component-decision-tests
  level: 推奨
  kind: judgment
  rule: コンポーネントにするかは、繰り返し使うか、全インスタンスで HTML の構造・クラス・ARIA 属性・data 属性・条件分岐・JavaScript の振る舞いを制御したいか、既知の要件として構造の拡張があるか、の順に判定する。
  reason: コンポーネントが役に立つのは、HTML の構造や振る舞いを1つの定義から管理したいときで、見た目の共通化だけなら CSS で足りるため。
  note: '繰り返し使わないものは、親のスコープの中に書きます。繰り返し使っていても CSS だけで管理できるなら、コンポーネントにしません。全インスタンスで制御したいものがはっきりあれば、2つ目の問いでコンポーネントにすると決まります。制御したいものはあるが決め手に欠けるときは、既知の構造の拡張があればコンポーネントにし、なければまだコンポーネントにしません。「3回出てきた」はパターンへの昇格の目安で、コンポーネントにする目安ではありません。セクションの導入（小見出し、見出し、リード文の組）のように判定に迷うまとまりは、デフォルトでは親の子要素として書き、バリエーションや補助の要素の有無を入力点として管理したいときにコンポーネントにします。コンポーネントにしたものは、ルートに `scoped <名前>` を付けて `@scope (.scoped.<名前>) to (.scoped)` で書き、外から変えてよい値を公開プロパティにします。'
  aiProne: true
  page: components/what-is-a-component
  since: 0.12.0

- id: no-component-for-look-only
  level: 非推奨
  kind: judgment
  rule: 見た目が共通だという理由だけで、コンポーネントを作らない（段落、区切り線、単純な見出し、見た目だけをまとめた wrapper はコンポーネントにしない）。
  reason: 管理したい構造や振る舞いを持たないものをコンポーネントにすると、ファイルとルートが増えるうえ、wrapper のルートの `.scoped` で親のスコープが打ち切られ、親の CSS から中身を選べなくなるため。
  note: 段落と区切り線はベーススタイルとトークンで、役割のある見た目の断片はパターンで、配置はコンポジションで、単機能の補助はユーティリティで扱います。
  aiProne: true
  page: components/what-is-a-component
  since: 0.12.0

- id: no-component-for-future-guess
  level: 非推奨
  kind: judgment
  rule: 将来必要になりそう、ほかの案件でよくある、という予測だけでコンポーネントを作らない。
  reason: 使われない入力点と分岐が定義に残り、読む人がそれを維持し続けることになるため。
  note: 構造の拡張をコンポーネントにする根拠にできるのは、いまの要件、既存の実装、仕様書、既知の派生要件に書かれているときだけです。
  page: components/what-is-a-component
  since: 0.12.0

- id: local-parts-stay-in-parent
  level: 推奨
  kind: judgment
  rule: 親の中でしか意味を持たない区画（カードの見出し、本文、フッター、内側を包む要素など）は、別のコンポーネントにせず、親の `@scope` の中でタイプセレクタか子クラスで選ぶ。
  reason: 区画をコンポーネントに分けると、区画のルートの `.scoped` で親のスコープが打ち切られ、親の中の並びを親の CSS だけで決められなくなるため。
  note: 親の外でも独立した責務と再利用の価値を持つ子要素（カードの中のボタンなど）は、別のコンポーネントにしてかまいません。
  aiProne: true
  page: components/what-is-a-component
  since: 0.12.0

- id: subgrid-list-as-one-component
  level: 推奨
  kind: judgment
  rule: '`subgrid` で項目の中の行を一覧の行にそろえるときは、一覧と項目を1つのコンポーネントにし、項目を一覧の子要素として書く。'
  reason: '`subgrid` の項目は、一覧のグリッドの行にまたがって初めて行がそろい、一覧の外に取り出すとそろえる相手がなくなるため。項目をコンテナにすると `subgrid` にできないので、項目を別のコンポーネントにして置かれた幅で形を変えることもできないため。'
  note: '一覧のルートに `grid` などのコンポジションを付けるときは、列の最小幅や間隔を一覧の `:scope` から渡します。項目の形を置かれた幅で切り替えるときは、一覧のルートをコンテナにし、項目がフラグを宣言します（`density-via-style-query`）。項目だけを一覧の外に1つ置く場所があっても、1項目の一覧として置きます。'
  page: components/what-is-a-component
  since: 0.58.0

- id: component-split-by-role
  level: 推奨
  kind: judgment
  rule: 見た目が似ていても、役割や中に入る内容が異なるものは、別のコンポーネントにする。
  reason: 別物を1つにまとめると分岐が増えて肥大化し、後から不要になった部分も捨てられなくなるため。
  note: 見た目の共通化だけを理由に、新しいコンポーネントを作ることもしません。
  page: components/what-is-a-component
  since: 0.1.0

- id: share-look-with-tokens
  level: 推奨
  kind: judgment
  rule: 別のコンポーネントの間で見た目をそろえたいときは、コンポーネントを統合せず、同じトークンを参照する。
  reason: 見た目の変更はトークンの値を変えるだけで済み、それぞれのコンポーネントは独立したまま保てるため。
  page: components/what-is-a-component
  since: 0.1.0

# 10-2 コンポーネントの境界を守る
- id: one-component-per-file
  level: 必須
  kind: convention
  rule: コンポーネントの CSS は、コンポーネントごとに1つのファイルに書き、複数のコンポーネントの CSS を1つのファイルに混ぜない。
  reason: 混ぜると、どこに何が書いてあるかがファイル名から分からなくなり、使わなくなったコンポーネントを安全に消せなくなるため。
  note: ファイル名はルートの名前とそろえます。Astro のように CSS をコンポーネントのファイルに書く環境では、そのファイルが単位になります。小さな部品でも例外にしません。本書のデモは、比べるために複数のコンポーネントを1つのファイルに書くことがあります（付録I「デモだけの例外」）。
  aiProne: true
  page: components/boundaries
  since: 0.5.0

- id: no-external-layout-on-root
  level: 非推奨
  kind: judgment
  rule: 'コンポーネントのルートに、外部関連型のレイアウト（`margin`、`position: absolute` と `inset`、`flex`、`grid-area`、`align-self`、`inline-size`、`block-size` など）を指定しない。'
  reason: 置かれる場所を前提にしたコンポーネントになり、ほかの場所に置いたときに打ち消しや上書きが必要になるため。
  note: '例外は、`position: fixed` で表示するモーダル、ビューポートに粘着するグローバルヘッダーの `position: sticky` と `inset`、`inline-size: 1em` などで文字サイズに追従させるアイコンのような小さな要素です。'
  aiProne: true
  page: components/boundaries
  since: 0.1.0

- id: parent-owns-child-placement
  level: 推奨
  kind: judgment
  rule: 子のコンポーネントの配置と外側の余白は、親の `gap` やグリッドか、親の子要素として置く Outer の要素で指定する。
  reason: 配置を決める責任を置く側にまとめれば、子のコンポーネントはどこに置かれても同じように振る舞えるため。
  note: 'Outer は親のコンポーネントの子要素として扱い、単独のコンポーネントにはしません。要素の数を減らすために、子のコンポーネントのルートに親の子要素のクラスを付けて配置と見た目の2つの役割を持たせることはせず、Outer で包みます。役割のある `div` や `span` は、数が増えてもかまいません。'
  page: components/boundaries
  since: 0.1.0

- id: no-class-to-child-component
  level: 非推奨
  kind: judgment
  rule: 子のコンポーネントに `class` 属性を渡して、親から見た目や配置を変えない。
  reason: 親が子のルートに自由にスタイルを当てられるようになり、どこまでが子の責任なのかが曖昧になるため。
  page: components/boundaries
  since: 0.1.0

- id: type-selector-in-scope
  level: 推奨
  kind: convention
  rule: '`@scope` の中の要素はタイプセレクタで選び、子クラスは同じ種類の要素を役割で区別するときと、`div` と `span` に役割を示すときだけ付ける（`._list` や `._link` のように要素の種類と同じ意味のクラスを付けない）。'
  reason: '`@scope` の中のタイプセレクタはそのコンポーネントの範囲にしか当たらず、要素の種類を繰り返すだけのクラス名は情報を増やさずに記述量を増やすため。`div` と `span` は要素そのものが意味を持たず、要素の種類から役割を読み取れないため、1つしかなくてもクラスで補う。'
  note: '`div` と `span` に付けるクラスは、`._body` や `._badge` のように役割の名前にします。役割を区別するクラスは `._main-link` と `._sub-link` のように要素の役割の語まで含めて名付け、共通のスタイルはタイプセレクタに、固有のスタイルは子クラスに書きます。スコープの中のタイプセレクタは詳細度が 0.0.1 なので `:where()` で包みません（ベーススタイルの `:where()` は第4章のルール `where-for-base-selectors`）。`a:focus-visible` や `a:any-link:hover` のように擬似クラスを付けると 0.1.1 や 0.2.1 になり子クラスに勝つので、役割ごとに違う状態のスタイルは `._sub-link:focus-visible` や `._sub-link:any-link:hover` のように子クラスの側に書きます。同じコンポーネントの中で同じ種類の要素が入れ子になるときは役割が分かれるので子クラスを付け、任意の HTML が入る領域は別のコンポーネントにします。コンポーネントの見出しは、1つしかなくても `._title` を付けてかまいません。見出しのレベル（`h2` か `h3` か）は置く場所の文書構造で変わるので、タイプセレクタで選ぶと、レベルを変えたときにスタイルが当たらなくなるためです。'
  aiProne: true
  page: components/boundaries
  since: 0.7.0

- id: no-type-under-child-class
  level: 推奨
  kind: judgment
  rule: 子要素のクラスの下にある要素を、子孫結合子のタイプセレクタ（`._summary p`）で選ばない。同じ種類の要素を領域ごとに変えたいときは、その要素にクラスを付ける。
  reason: 子孫結合子は深さを問わないので、領域の中に後から足した同じ種類の要素にも当たり、どの要素が対象かを HTML の入れ子から確かめることになるため。詳細度も 0.1.1 に上がり、クラス1つのセレクタでは上書きできなくなる。
  note: 領域の直下の要素を配置や余白のために選ぶときは、子要素のクラスのルールの中にネストして `& > p` と子結合子で書きます。ネストに書くのは、要素の間の余白や `grid-area` のように親のレイアウトで決まる宣言だけで、色や大きさは直下の要素でもクラスを付けて書きます（`nest-child-placement-only`）。ネストしても子孫結合子（`& p`）は使わず、`._summary > p` のように1つのセレクタに並べても書きません。CMSが出力する本文のように、マークアップにクラスを付けられない領域は例外です。
  aiProne: true
  page: components/boundaries
  since: 0.46.0

- id: no-other-component-internals
  level: 禁止
  kind: judgment
  rule: ほかのコンポーネントのルートや内部の要素を、セレクタで選んで見た目を上書きしない。
  reason: 詳細度の競争が起き、子の構造を変えたときに親の CSS も直す必要が出るため。
  note: 値を変えたいときは、子のコンポーネントが用意した公開プロパティに値を渡します。ページの CSS から子のルートを選ぶしかない場合も、指定するのは公開プロパティの値と配置だけにします。
  aiProne: true
  page: components/boundaries
  since: 0.1.0

- id: z-index-tokens-only
  level: 必須
  kind: convention
  rule: z-index の値は、数値を直接書かずにトークンで指定する。
  reason: 重なり順の関係が名前から読め、値の積み増しを防げるため。
  note: 相対的な値の 1 と -1 も、`--z--forwards` と `--z--backwards` で指定します。
  lint: 'Stylelint: `declaration-property-value-disallowed-list`（1 と -1 を含むすべての数値を警告）'
  aiProne: true
  page: components/boundaries
  since: 0.1.0

- id: z-index-absolute-root-relative-inside
  level: 必須
  kind: convention
  rule: コンポーネントのルートには絶対的な z-index だけを、内部の要素には相対的な z-index（`--z--forwards` と `--z--backwards`）だけを指定する。
  reason: ページ全体の重なり順と、コンポーネントの中の前後関係を分けて管理できるため。
  note: 重なり順は、まず HTML の順番で解決し、足りないときだけ相対的な z-index を使います。子のコンポーネントどうしの前後は、ルートに相対的な z-index を持たせず、親のコンポーネントが子を包む Outer の要素で指定します。
  page: components/boundaries
  since: 0.1.0

- id: isolation-for-relative-z-index
  level: 必須
  kind: spec
  rule: '内部の要素で相対的な z-index を使うコンポーネントは、その重なりを閉じ込める要素に `isolation: isolate` を指定する。閉じ込める要素は、コンポーネントのルートか、z-index を使う要素をすべて含む内部の区画にする。'
  reason: 内部の z-index がほかのコンポーネントと干渉せず、-1 の要素がルートや親の背景の下に隠れることもなくなるため。
  note: 'z-index を使う要素が、タブの1つの項目や飾りを持つリンクのように1つの区画の中で完結するなら、その区画に指定します。区画をまたいで重なりを比べるときは、ルートに指定します。-1 の要素が隠れないために要るのは、閉じ込める要素がスタッキングコンテキストを作っていることです。`position: sticky` や `opacity` などで、すでにスタッキングコンテキストができている要素もありますが、それらの値は見た目の都合で変わるので、本書では予防のために `isolation: isolate` を明示します。'
  aiProne: true
  page: components/boundaries
  since: 0.1.0

- id: top-layer-z-index-top
  level: 推奨
  kind: judgment
  rule: 'トップレイヤーに表示する `<dialog>` や `popover` 属性の要素に閉じる動きを付けるときは、`z-index: var(--z--top)`（値は `calc(infinity)`）も指定する。'
  reason: '`transition-property: overlay` に対応していないブラウザでは、閉じるアニメーションの途中で z-index の大きい要素の下に潜り込むことがあるため。'
  note: '`overlay` に対応しているのは Chromium 系のブラウザだけです。閉じる動きのない要素は、トップレイヤーにある間はほかの要素より前に出るので、指定しません。'
  page: components/boundaries
  since: 0.1.0

# 10-3 コンポジションとユーティリティ
- id: compositions-for-layout-patterns
  level: 推奨
  kind: judgment
  rule: 積む、並べて折り返す、列数を切り替えるといった、コンポーネントに依存しない配置は、コンポジション（`stack`、`cluster`、`switcher` など）で書く。
  reason: 折り返しなどの守りの指定が1か所に集まり、HTML のクラス名から配置の意図が読めるため。
  page: components/compositions-and-utilities
  since: 0.1.0

- id: composition-layout-only
  level: 推奨
  kind: judgment
  rule: コンポジションには配置に関わる指定だけを書き、色や文字の大きさなどの見た目を持たせない。
  reason: どのコンポーネントの中でも、配置の部品として同じように使えるため。
  page: components/compositions-and-utilities
  since: 0.1.0

- id: composition-configurable-via-props
  level: 推奨
  kind: judgment
  rule: コンポジションの間隔や列数は、修飾のクラスを増やさず、`--stack--gap` のような公開プロパティで受け取る。
  reason: 使う側が `style` 属性で値を渡せ、1つのクラスでさまざまな間隔や列数に対応できるため。
  note: 公開プロパティの一覧は、ファイルの先頭の説明ブロックに `@prop` で書きます（第9章のルール `prop-tag-for-public-properties`）。
  page: components/compositions-and-utilities
  since: 0.1.0

- id: composition-default-gap-zero
  level: 推奨
  kind: judgment
  rule: コンポジションの間隔のデフォルト値は `0` にし、間隔は使う側で指定する。
  reason: 間隔は置く文脈で決まる値なので、指定し忘れた箇所に意図しない余白が付くのを防ぐため。
  note: '行と列の間隔を持つコンポジションでは、`--cluster--gap` で一括に、`--cluster--row-gap` と `--cluster--column-gap` で個別に指定できるようにします。`switcher` や `grid` のように間隔を `calc()` で長さと足し合わせるコンポジションでは、デフォルト値を `0px` にします（`switcher-gap-default-with-unit`）。'
  page: components/compositions-and-utilities
  since: 0.1.0

- id: utility-single-purpose
  level: 推奨
  kind: judgment
  rule: ユーティリティは、`.-visually-hidden` のように、どこに付けても同じ意味を持つ単機能のクラスに限る。
  reason: '`utilities` レイヤーはコンポーネントより優先されるので、どこで勝っても困らないものでなければならないため。'
  page: components/compositions-and-utilities
  since: 0.1.0

- id: adjust-locally-first
  level: 推奨
  kind: judgment
  rule: 余白や配置の細かな調整は、まずコンポーネントの CSS で行い、次にコンポジションやユーティリティ、その次にパターンを検討する。
  reason: その場の都合で共通の部品を増やすと、共通の部品が何のためにあるのかが分からなくなるため。
  note: 「ここだけ影がほしい」のような都合だけで、パターンやコンポーネントを作りません。
  page: components/compositions-and-utilities
  since: 0.1.0

- id: pattern-leaves-component-properties
  level: 推奨
  kind: convention
  rule: パターンには、重ねるコンポーネントが指定しないプロパティだけを書き、コンポーネントの側で変える値は `--<パターン>--<プロパティ>` の公開プロパティで受け取る。
  reason: '`patterns` は `components` より後ろのレイヤーにあり、パターンを付けた要素では、コンポーネントの CSS（状態や `@container` の中の指定を含む）が同じプロパティに詳細度を上げても勝てないため。'
  note: '公開プロパティは、パターンの中で宣言せず、`--_p--size: var(--icon--size, 1em);` のように `--_p--` で始まる内部プロパティに受けて、デフォルト値をフォールバックに書きます。`:hover` などの状態で見た目が変わるものは、パターンにせずコンポーネントにします。強さはレイヤーの順番で決まるので、パターンのセレクタを `:where()` で包んで詳細度を下げる必要はありません。'
  aiProne: true
  page: components/compositions-and-utilities
  since: 0.11.0

# 10-4 デザイントークン
- id: token-naming-category-first
  level: 必須
  kind: convention
  rule: トークンは `--<分類>--<名前>` の形で名付ける（例：`--color--neutral--500`、`--spacing--md`）。
  reason: 先頭の分類で値の種類が分かり、コンポーネントの公開プロパティとも見分けられるため。
  note: 色の役割を表すセマンティクスのトークンは、`--<役割>--<バリエーション>`（例：`--foreground--muted`）にします。
  aiProne: true
  page: components/design-tokens
  since: 0.1.0

- id: tokens-on-root
  level: 推奨
  kind: convention
  rule: トークンは分類ごとのファイルに分けて `:root` に定義し、`tokens` レイヤーに入れる。
  reason: サイト全体の値の一覧が1か所にまとまり、CSS から参照できるデザインガイドとして使えるため。
  page: components/design-tokens
  since: 0.1.0

- id: color-token-two-layers
  level: 推奨
  kind: judgment
  rule: 色のトークンはプリミティブとセマンティクスの2層で定義し、デザインにない固有の色はグローバルなトークンにしない。
  reason: 配色の変更やダークモードをセマンティクスの層で吸収でき、トークンの一覧もデザインの取り決めだけに保てるため。
  note: '固有の色は、コンポーネントの内部プロパティか、直接書いた値で扱います。影は形をスケールのトークンにし、各層の色だけをセマンティクスにします（`box-shadow` の値全体は `light-dark()` で切り替えられないため）。'
  page: components/design-tokens
  since: 0.1.0

- id: typography-token-two-layers
  level: 推奨
  kind: judgment
  rule: '文字のトークンは、プリミティブの `--font-size--*` と、役割ごとの `--text--<役割>--font-size` と `--text--<役割>--leading` の組の2層で定義し、コンポーネントからは役割を参照する。'
  reason: 同じ文字サイズを複数の役割が使うので、役割ごとに大きさを変えられ、文字サイズと行の高さも役割を選ぶだけでそろうため。
  note: '文字サイズは単位なしのピクセル相当の数値で持ち、`calc(var(--text--body--font-size) / 16 * 1rem)` のように使う場所で変換します。余白、角丸、影の形、モーションは1層のスケールのままにします。役割の層を作ると、1つのコンポーネントでしか使わない名前が増えるためです（`no-single-use-token`）。'
  page: components/design-tokens
  since: 0.38.0

- id: no-single-use-token
  level: 禁止
  kind: judgment
  rule: 1回しか使わない値や、特定のコンポーネントだけで使う値を、グローバルなトークンにしない。
  reason: トークンがサイト全体の取り決めではなくなり、一覧から選ぶだけで取り決めに沿えるという利点が失われるため。
  note: 1つのコンポーネントの中で意味を持つ値は、内部プロパティにして名前を付けます。
  page: components/design-tokens
  since: 0.1.0

- id: use-defined-tokens
  level: 推奨
  kind: judgment
  rule: トークンとして定義されている値は、数値や色を直接書かずにトークンを参照する。
  reason: デザインの変更をトークンの修正だけで反映でき、わずかに違う値が紛れ込むのを防げるため。
  note: 色、文字、角丸、影、余白のように、スケールとして定義した値はトークンを参照します。`%` や `cqi` と組み合わせて計算する余白は、その場に直接書いてかまいません。トークンに定義されていない特殊な値は、トークンを追加せずにその場に直接書きます。
  aiProne: true
  page: components/design-tokens
  since: 0.1.0

- id: motion-tokens
  level: 推奨
  kind: judgment
  rule: イージングと再生時間はトークンにし、イージングは `--ease--out-quint` のように強さと方向が分かる名前にする。
  reason: サイトの中で動きの速さと質感がそろい、全体の調整もトークンの値を変えるだけで済むため。
  page: components/design-tokens
  since: 0.1.0

- id: z-index-token-scale
  level: 推奨
  kind: convention
  rule: z-index のトークンは、絶対的な値を100刻みで定義し、相対的な値は `--z--forwards`（1）と `--z--backwards`（-1）の2つだけにする。
  reason: 後から新しい要素を間に差し込め、コンポーネントの中の重なりも2つの値で足りるため。
  note: 'ヘッダーのすぐ手前に重ねるときは、`calc(var(--z--header) + 1)` のようにトークンを基準に計算します。'
  page: components/design-tokens
  since: 0.1.0

# 10-5 公開プロパティと内部プロパティ
- id: public-property-naming
  level: 必須
  kind: convention
  rule: 外から変えてよい値は、`--<コンポーネント>--<プロパティ>` の公開プロパティにする（例：`--card--radius`）。
  reason: ほかのコンポーネントとの名前の衝突を防ぎ、どのコンポーネントの値かが名前から分かるため。
  aiProne: true
  page: components/custom-properties
  since: 0.1.0

- id: internal-property-prefix
  level: 必須
  kind: convention
  rule: コンポーネントの中だけで使う値は、`--_` で始まる内部プロパティにする。
  reason: 外から変えてよい値と、内部の都合の値を名前で見分けられるため。
  note: 'コンポジションは `--_c--`、パターンは `--_p--`、ユーティリティは `--_u--`、ベースのスタイルは `--_b--` で始めます。トランジションなどのために `@property` で登録する値は、全体で名前が衝突しないよう、コンポーネントの中だけで使う値でも `--<コンポーネント>--<プロパティ>` の形にしてかまいません。'
  aiProne: true
  page: components/custom-properties
  since: 0.1.0

- id: receive-public-property-with-fallback
  level: 必須
  kind: convention
  rule: 公開プロパティはコンポーネント自身では宣言せず、`:scope` で内部プロパティに受けて、デフォルト値を `var()` のフォールバックに書く。
  reason: コンポーネント自身で宣言すると、親から継承した値がその宣言に負けて届かなくなるため。
  note: '例：`--_radius: var(--card--radius, 8px);`。`@property` で登録して `initial-value` を持たせた公開プロパティ（アニメーションさせる値など）は、この規約の例外で、宣言の中で直接読んでかまいません。未定義にならないのでフォールバックが要らず、内部プロパティに受け直すと、アニメーションさせるプロパティと宣言で読むプロパティが分かれてしまうためです。テンプレートが項目ごとに `style` 属性へ書く値（`--_index`、`--_hue` など）は、コンポーネントが自分の子に書く値なので、公開プロパティにせず内部用の名前にし、`:scope` で受け直しません。'
  aiProne: true
  page: components/custom-properties
  since: 0.1.0

- id: state-suffix-for-custom-properties
  level: 必須
  kind: convention
  rule: 状態やモードで変わる値は、`--_background--hocus` のように `--` で区切った接尾辞で表し、デフォルトの状態には接尾辞を付けない。
  reason: 状態ごとの値を `:scope` の先頭に並べて見渡せ、状態のセレクタでは参照を切り替えるだけで済むため。
  note: '幅などの条件で変わる値を受け取る公開プロパティにも、`--media-card--gap--spacious` のように同じ形の接尾辞を付け、名前は幅のフラグの値（`--compact`、`--spacious`）にそろえます。接尾辞の対象は、擬似クラスや ARIA 属性で切り替わる状態と、幅の条件です。`data-variant` のバリエーションは状態ではないので、`&[data-variant="…"]` の中で内部プロパティを宣言し直します（9-2）。'
  page: components/custom-properties
  since: 0.1.0

- id: pass-values-via-style-attribute
  level: 推奨
  kind: judgment
  rule: 公開プロパティの値は、できるだけ呼び出し側の `style` 属性で渡す。
  reason: 値が対象のタグと同じ場所に書かれ、セレクタや詳細度に依存せずに渡せるため。
  note: 複数の子にまとめて渡すとき、クエリで値を切り替えるとき、`:hover` や `:has()` などの状態で値を変えるときは、CSS で渡してもかまいません。
  aiProne: true
  page: components/custom-properties
  since: 0.1.0

- id: at-property-only-when-needed
  level: 推奨
  kind: judgment
  rule: '`@property` は、型の指定やアニメーションが必要なカスタムプロパティにだけ使い、トークンの定義には使わない。'
  reason: 登録すると値を定義した要素で計算されるなど振る舞いが変わり、不要な登録は予期しない結果を招くため。
  page: components/custom-properties
  since: 0.1.0

- id: at-property-all-descriptors
  level: 必須
  kind: spec
  rule: '`@property` では `syntax` と `inherits` の記述子を書き、`syntax` が `"*"` 以外なら `initial-value` も書く。'
  reason: '`syntax` と `inherits` は必須で、どちらかが欠けると `@property` のルールごと無効になるため。`initial-value` も、`syntax` が `"*"` 以外なら必須で、欠けたり、計算上独立した値でなかったり（`3em` のように、要素の文字サイズに依存して決まる値）すると、ルールごと無効になる。'
  note: 根拠は CSS Properties and Values API Level 1 の `@property` の節です。`syntax` が `"*"` のときの `initial-value` は、ルール `at-property-initial-value-always` で扱います。
  page: components/custom-properties
  since: 0.1.0

- id: at-property-initial-value-always
  level: 必須
  kind: convention
  rule: '`@property` の `initial-value` は、`syntax` が `"*"` で仕様上省略できるときも書く。'
  reason: 3つの記述子がいつもそろっていれば、読む人が初期値をほかの場所で探さずに済むため。
  note: '`syntax` が `"*"` のときに `initial-value` を省略しても、`@property` は無効になりません。省略したときの初期値は「保証された無効値」です。書くのは本書の方針で、仕様の条件はルール `at-property-all-descriptors` で扱います。'
  page: components/custom-properties
  since: 0.67.0

- id: animated-property-no-inherit
  level: 推奨
  kind: judgment
  rule: 'トランジションやアニメーションで値を動かすカスタムプロパティは、`inherits: false` で登録し、`opacity` や `translate` だけを動かすならカスタムプロパティを介さずに直接動かす。'
  reason: 継承するカスタムプロパティを動かすと、子孫の要素すべてでスタイルの計算がフレームごとに繰り返され、カスタムプロパティを介すと合成処理だけで済まなくなるため。
  page: components/custom-properties
  since: 0.5.0

# 10-6 スタイルクエリで状態を伝える
- id: density-via-style-query
  level: 必須
  kind: convention
  rule: '同じ閾値で見た目の変わる子要素が2つ以上あるときは、コンテナサイズクエリ（`@container --scoped (…)`）を、コンポーネントの中で、フラグを宣言する1つの要素のルールだけに書く。その要素はクエリの外で `--_density: --compact` をデフォルト値として宣言してクエリの中で `--_density: --spacious` に切り替え、ほかの子孫は `@container style(--_density: --spacious)` で切り替える。'
  reason: 閾値が1か所にまとまり、変えるときに直す場所が1つで済むため。子要素ごとにコンテナサイズクエリを書くと、直し忘れたときに、どの幅のデザインにもない中間の状態ができる。
  note: 'フラグを宣言した要素自身はスタイルクエリで問い合わせられないので、その要素の見た目は同じサイズクエリの中で変えます。`:scope` に書いた `@container --scoped (…)` は外側のコンポーネントを問い合わせるので、フラグは `._body` のようなルートの子孫に置きます。3段階が要るときだけ `--regular` を足し、`--compact`、`--regular`、`--spacious` の順に切り替えます。狭いときの見た目がブラウザのデフォルトのスタイルを打ち消すもの（表を縦に積む、ラベルを隠すなど）は、広いときに戻す宣言が要らないよう、`@container style(--_density: --compact)` の側に書いてかまいません。サイズクエリを書く要素が1つだけで、フラグを読む子孫がない場合はフラグを宣言しません。切り替えが4段階以上あり、閾値の式そのもの（列の最小幅と間隔の掛け算など）を見せる必要がある場合は、例外としてサイズクエリを子のルールに残します。フラグを宣言する要素自身の、親のレイアウトで決まる宣言（`grid-row: span 4` など）は、親のルールの直下の子へのネスト（`nest-child-placement-only`）に、同じ閾値のサイズクエリで書きます。その要素は自分のフラグを問い合わせられないためで、閾値の値はフラグを宣言するクエリとそろえます。'
  aiProne: true
  page: components/style-queries
  since: 0.20.0

- id: hocus-via-style-query
  level: 必須
  kind: convention
  rule: '親や自身のホバーとフォーカスで子要素や擬似要素の見た目を変えるときは、`--_hocus: --false` をデフォルト値として宣言し、`&:any-link:hover`（`@media (any-hover)` の中）と `&:focus-visible` で `--_hocus: --true` に切り替え、子要素と擬似要素は `@container style(--_hocus: --true)` で切り替える。'
  reason: ホバーとフォーカスの2つの条件を1か所に書けば済み、子孫結合子で子を選ぶ書き方（`&:any-link:hover ._icon`）と違って詳細度が上がらず、子の見た目が子のルールにまとまるため。
  note: '擬似要素（`::before`、`::after`、`::marker`）のスタイルクエリは元の要素を問い合わせるので、自身の擬似要素もこの形で書けます。フラグを立てた要素自身の見た目は、状態のセレクタに直接書きます。子の状態で親自身の見た目を変えるときは `:has()` を使い、子孫のホバーとフォーカスをほかの子孫に伝えるときは、`&:has(:any-link:hover)`（`@media (any-hover)` の中）と `&:has(:focus-visible)` で `--_has-hocus: --true` を立てます。キーボード操作のときに自身の擬似要素のトランジションを外すだけなら、`&:not(:focus-visible)::after` のように、状態のセレクタに擬似要素を続けて書いてかまいません。ホバーだけで出し、フォーカスでは出さない自身の擬似要素も、`&:enabled:hover::before`（`@media (any-hover)` の中）のように状態のセレクタに直接書きます。ホバーとフォーカスで子の見た目そのものを分けたいときは、`&:focus-visible` で `--_focus-visible: --true` のような2つ目のフラグを立てます。'
  aiProne: true
  page: components/style-queries
  since: 0.23.0

- id: state-flag-values
  level: 必須
  kind: convention
  rule: 'スタイルクエリで問い合わせるフラグの値は、`--compact` のような `--` で始まる識別子にし、オンとオフの2値の状態は `--true` と `--false` にそろえる。'
  reason: 'スタイルクエリは値が一致するかどうかだけを調べるので、`1` や `true` が混ざると、書き間違えても条件が成り立たないだけで誤りに気付けないため。`--` で始めれば、自分で付けた名前だと分かる。'
  note: '`--color-scheme--current: --light` のように、2値でも状態の名前そのものを値にするフラグは、そのままにします。範囲の比較（`style(--_columns > 2)`）はSafariが対応していないので使いません。'
  aiProne: true
  page: components/style-queries
  since: 0.23.0

# 10-7 置き場所と子の状態を伝える
- id: placement-via-public-flag
  level: 推奨
  kind: judgment
  rule: '置き場所の構造によってコンポーネントの見た目を変えるときは、置く側が子のルートを包む要素で公開プロパティのフラグ（`--product-card--featured: --true`）を宣言し、子は `:scope` で内部プロパティ（`--_featured: var(--product-card--featured, --false)`）に受けて、自分の幅のフラグと `@container style(--_density: --spacious) and style(--_featured: --true)` のように組み合わせる。'
  reason: 子の見た目が子のファイルにまとまり、置き場所が増えても子の CSS を変えずに済むため。置く側のセレクタから子の内部を選んだり、外側の要素のコンテナを問い合わせたりすると、子が置き場所の構造に依存する。
  note: '置く側が渡すのは状態だけにし、文字サイズのような見た目の値は渡しません。編集者が選ぶ特集のように、置き場所の構造から決まらないものは、HTMLの `data-variant` で指定します。'
  page: components/placement-and-child-states
  since: 0.28.0

# 10-8 Web Components
- id: custom-element-as-scope-root
  level: 推奨
  kind: convention
  rule: 'カスタム要素で作る部品は、カスタム要素そのものに `scoped` クラスを付けてルートにし、CSS は外部のファイルに `@scope (<要素名>.scoped) to (.scoped)` の形で書く。'
  reason: 要素名がコンポーネントの名前を受け持ち、`scoped` クラスが外側のスコープの下限になるので、ほかのコンポーネントと同じ規約で境界を作れるため。
  note: '名前のクラス（`scoped <名前>` の `<名前>`）は付けません。カスタム要素の中に `<style>` を置いて前置きのない `@scope` で書く方法は、部品を置いた数だけ同じ `<style>` が出力され、CSS がコンポーネントごとのファイルにまとまらないので使いません。'
  aiProne: true
  page: components/web-components
  since: 0.21.0

- id: custom-element-root-display
  level: 必須
  kind: spec
  rule: 'カスタム要素のルートには、`display: block flow` のように `display` を明示する。'
  reason: カスタム要素にはブラウザのデフォルトスタイルがなく、`display` が初期値の `inline` になるので、中にブロックの要素を置くと幅の指定が効かず、背景や枠線も中身を囲む形で描かれないため。
  note: 'Shadow DOM で作る部品では、`:host` に書きます。'
  aiProne: true
  page: components/web-components
  since: 0.21.0

- id: custom-element-enhances-html
  level: 推奨
  kind: judgment
  rule: 'JavaScript がなくても動く HTML（`popover` 属性、`<dialog>` と `command` 属性など）を先に作り、カスタム要素は振る舞いを足すだけにする。'
  reason: スクリプトの読み込みが遅れたり失敗したりしても部品を操作でき、開閉やフォーカスの扱いを自作せずにブラウザに任せられるため。
  note: 'ホバーで開く、フォーカスが外に出たら閉じる、View Transitions で開閉をつなぐ、設定を保存する、といった処理をカスタム要素が受け持ちます。定義前の表示を `:not(:defined)` で変えるときも、中身は隠しません（5-7）。'
  aiProne: true
  page: components/web-components
  since: 0.21.0

- id: custom-element-settings-attrs-and-props
  level: 推奨
  kind: judgment
  rule: 'カスタム要素の設定は、振る舞いの設定を属性（`hoverable` など）で、見た目の設定を公開プロパティ（`--<要素名>--<プロパティ>`）で受け取る。'
  reason: 見た目の設定を公開プロパティにすれば、JavaScript が動く前から CSS だけで値が届き、親から継承でまとめて渡すこともできるため。
  page: components/web-components
  since: 0.21.0

- id: light-dom-for-received-children
  level: 推奨
  kind: judgment
  rule: 'ページから子要素を受け取る部品は Light DOM で作り、Shadow DOM は中身をすべて自分で描く部品に限って使う。'
  reason: 子要素を受け取る部品を Shadow DOM で作ると、子要素はページの DOM に残り、それを囲む要素だけが Shadow DOM に入るので、1つの部品の CSS がページの CSS ファイルと Shadow DOM の中に分かれるため。
  note: Light DOM で作れば、部品の CSS は1つのファイルにまとまり、kiso.css のリセットやユーティリティもそのまま当たります。Shadow DOM の中には、ページのセレクタが当たらず、継承する値（カスタムプロパティを含む）だけが届きます。
  aiProne: true
  page: components/web-components
  since: 0.21.0

- id: shadow-dom-host-and-element-selectors
  level: 推奨
  kind: convention
  rule: 'Shadow DOM の CSS では、`:host` に `display` と内部プロパティを書き、中の要素はクラスや `@scope` を使わずに要素と属性のセレクタで選ぶ。'
  reason: Shadow DOM の境界がスコープの役目を果たすので、短いセレクタでも外に漏れず、ページのセレクタも中に当たらないため。
  note: 'CSS は `<template>` の中の `<style>` に書き、`attachShadow()` で作った Shadow DOM に複製します。ネスト、`@media (any-hover)` の中のホバー、`prefers-reduced-motion: no-preference` の中の動きは、Light DOM と同じ規約で書きます。'
  page: components/web-components
  since: 0.21.0

- id: shadow-dom-restate-page-styles
  level: 推奨
  kind: spec
  rule: 'Shadow DOM の中では、ページのトークンをカスタムプロパティで参照し、kiso.css のリセットやユーティリティに頼っていた指定は中に書く。'
  reason: カスタムプロパティは継承で境界を越えて届くが、ページのリセットとユーティリティのクラスは中の要素に当たらないため。
  note: 'たとえば、ボタンの `font` と `color` はブラウザのデフォルトに戻るので `inherit` を指定し、`.-visually-hidden` と同じ指定は中の要素に直接書きます。'
  aiProne: true
  page: components/web-components
  since: 0.21.0
