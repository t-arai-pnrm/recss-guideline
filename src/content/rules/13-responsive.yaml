# 第13章 レスポンシブデザイン

# 13-1 検討する順番
- id: responsive-escalation-order
  level: 必須
  kind: judgment
  rule: レスポンシブ対応は「静的 → イントリンシック → コンテナサイズクエリ → メディアクエリ」の順に検討し、上の段階で解決できるなら下の段階を使わない。
  reason: 条件分岐が減り、想定していない幅や置き場所でも崩れにくくなるため。
  aiProne: true
  page: responsive/escalation
  since: 0.1.0

- id: no-responsive-for-static-elements
  level: 推奨
  kind: judgment
  rule: タグ、バッジ、アイコンのように本質的に固定サイズの要素は、レスポンシブにしない。
  reason: '`clamp()` やクエリを足しても見た目はほとんど変わらず、コードの複雑さだけが増えるため。'
  note: アイコンは `1em` で文字サイズに追従させれば十分です。
  page: responsive/escalation
  since: 0.1.0

- id: max-inline-size-over-fixed-width
  level: 推奨
  kind: judgment
  rule: 幅は固定値ではなく `max-inline-size` で上限を決め、固定値が必要なときは `min(100%, …)` ではみ出しを防ぐ。
  reason: 狭い画面や狭い場所に置かれたときにも、内容に合わせて縮むため。
  aiProne: true
  page: responsive/escalation
  since: 0.1.0

- id: query-choice-by-layer
  level: 推奨
  kind: judgment
  rule: '`pages` レイヤーのスタイルではメディアクエリを、`components` レイヤーのスタイルではコンテナサイズクエリを優先する。'
  reason: ページ全体の段組みはビューポートに依存するが、コンポーネントはどこに置かれるかを自分では知らないため。
  note: モーダルやトーストのように、ビューポートに固定されるコンポーネントはメディアクエリを使います。
  page: responsive/escalation
  since: 0.1.0

# 13-2 ブレイクポイントの決め方
- id: breakpoint-from-content
  level: 必須
  kind: judgment
  rule: ブレイクポイントはデバイスの幅ではなく、レイアウトが崩れる幅から決める。
  reason: 画面幅の種類は無数にあり、特定の端末の幅に合わせても、その間の幅で崩れるため。
  page: responsive/breakpoints
  since: 0.1.0

- id: no-device-names
  level: 禁止
  kind: judgment
  rule: '`sp`、`tablet`、`pc` のようにデバイスを連想させる名前を、ブレイクポイントやクラス名（`.sp-only` など）に使わない。'
  reason: 画面の幅とデバイスの種類は一致せず、名前と実態がずれていくため。
  aiProne: true
  page: responsive/breakpoints
  since: 0.1.0

- id: framework-breakpoint-variables
  level: 推奨
  kind: judgment
  rule: ブレイクポイントを変数として持つフレームワークを使う案件では、独自の値を足さず、フレームワークの変数を使う。
  reason: 案件の中でブレイクポイントの値がばらばらになるのを防ぐため。
  note: 'Sass の変数や Tailwind CSS の設定のように、ビルド時に値へ展開される変数が対象です。CSS のカスタムプロパティは、メディアクエリの条件では使えません（`no-var-in-query`）。'
  page: responsive/breakpoints
  since: 0.3.0

- id: breakpoint-follows-font-size
  level: 必須
  kind: spec
  rule: 既定の文字サイズで必要な幅が変わるレイアウトでは、メディアクエリの閾値を px で書かず、文字サイズに追従する単位で書く。
  reason: メディアクエリの中の rem と em はブラウザの既定の文字サイズを基準に計算されるが、px は計算されない。文字サイズを大きくしているユーザーは、rem で組んだ中身にとって使える幅が狭くなるので、閾値が追従しないと、中身が収まらない幅でも広い画面のレイアウトのままになる。
  note: '必要な幅が文字サイズに左右されないレイアウト（画像の大きさだけで決まる並びなど）では、px の閾値でも表示は崩れません。本書では、どちらの場合も表記を rem にそろえます（`breakpoint-in-rem`）。'
  aiProne: true
  page: responsive/breakpoints
  since: 0.77.0

- id: breakpoint-in-rem
  level: 必須
  kind: convention
  rule: ブレイクポイントは rem で指定し、`calc(640 / 16 * 1rem)` のようにピクセル値からの変換を式で書く。
  reason: 閾値の表記を1つにそろえれば、文字サイズに追従するかをレイアウトごとに判断せずに済み、式から元のピクセル値も読み取れるため。メディアクエリでは em も rem と同じ基準で計算されるので、em を選んでも挙動は変わらない。本書は `calc(N / 16 * 1rem)` の式に統一するために rem を選んでいる。
  note: '閾値の式に px で指定した `gap` や `padding` を含めるときは、その項だけ rem へ換算せず、px のまま足します（`threshold-as-formula`）。'
  aiProne: true
  page: responsive/breakpoints
  since: 0.1.0

- id: threshold-as-formula
  level: 推奨
  kind: judgment
  rule: クエリの閾値は、「列の最小幅×列数＋隙間×隙間の数」や「中身の幅＋`padding`＋`border`」のように、レイアウトが成り立つ条件を `calc()` の式で書く。
  reason: 数値の根拠がコードに残り、列数や隙間を変えたときにも直しやすいため。
  note: '根拠を式にしたほうが意図が明確になるときと、列数、個数、隙間、最小幅を後で変える可能性があるときに式にします。分解しても意味が増えない固定の値は、そのまま書いてかまいません。根拠のない値を `calc(48rem)` のように包むだけにはしません。一度しか使わない長い式には、何列・何個分なのかをコメントで補います。式の各項は、その値を宣言したときの単位で書きます。rem で指定した幅は変換の式で、px で指定した `gap`、`padding`、`border` は px のまま足し、`calc(560 / 16 * 1rem + 240 / 16 * 1rem + 32px)` のように書きます。px の値まで rem に換算すると、ユーザーが文字サイズを変えたときに閾値の中でだけ隙間が広がり、実際に並べられる幅とずれます。'
  aiProne: true
  page: responsive/breakpoints
  since: 0.1.0

- id: threshold-includes-gap-and-padding
  level: 必須
  kind: spec
  rule: 閾値の式には、レイアウトが成り立つ条件に関わる `gap`、`padding`、`border` を省かずに含める。
  reason: 省くと閾値が実際に並べられる幅より狭くなり、切り替わった直後の幅で中身がはみ出したり詰まったりするため。
  aiProne: true
  page: responsive/breakpoints
  since: 0.20.0

- id: no-var-in-query
  level: 禁止
  kind: spec
  rule: '`@media` の条件と、コンテナサイズクエリの条件の中で `var()` を使わない。'
  reason: メディアクエリの条件ではカスタムプロパティを参照できず、コンテナサイズクエリの条件では仕様で認められていても対象のブラウザでそろって動かず、値が問い合わせるコンテナで解決されて意図とずれやすいため。
  note: 'スタイルクエリで `style(--a: var(--b))` のようにカスタムプロパティどうしを比べる条件は、対象にしません。同じ閾値を複数の要素で使いたいときは、閾値を変数にせず、フラグを宣言する要素だけにコンテナサイズクエリを書き、ほかの子孫はスタイルクエリで切り替えます（`density-via-style-query`）。'
  aiProne: true
  page: responsive/breakpoints
  since: 0.1.0

# 13-3 コンテナサイズクエリ
- id: container-name-required
  level: 必須
  kind: convention
  rule: 'コンポーネントのルートをコンテナにするときは `container: --scoped / inline-size` と書いて `@container --scoped (…)` で問い合わせ、ルート以外の子要素をコンテナにするときはクラス名から下線を除いた名前（`._body` なら `--body`）を付ける。外側のコンポーネントのコンテナは問い合わせない。'
  reason: 名前のない `@container` はいちばん近い祖先のコンテナを参照するので、コンテナが入れ子になると参照先がコードから読み取れないため。ルートの名前をそろえておけば、`@scope` の下限で閉じた範囲の中では `--scoped` が常にそのコンポーネントのルートを指す。外側のコンポーネントのコンテナを問い合わせると、外のコンポーネントの定義に依存し、別の場所に置いたときに条件が成り立たなくなる。
  note: '外側から変えたい値は、公開用のカスタムプロパティで渡します。`:scope` のルールに `@container --scoped (…)` を書くと、ルートは自分自身を問い合わせられないので、外側のコンポーネントのルートを参照してしまいます。サイズの条件を持たない `@container style(…)` のスタイルクエリには、名前を付けません。コンテナサイズクエリを書くのはコンポーネントの中で1つのルール（フラグを宣言する要素）だけにし、ほかの子孫はスタイルクエリで切り替えます（`density-via-style-query`）。'
  aiProne: true
  page: responsive/container-size-queries
  since: 0.1.0

- id: container-name-dashed-ident
  level: 必須
  kind: convention
  rule: コンテナの名前は `--` で始める（例：`--scoped`、`--body`）。
  reason: 自分で付けた名前だとすぐに分かり、将来 CSS に追加されるキーワードとも衝突しないため。
  lint: 'Stylelint: `container-name-pattern`'
  aiProne: true
  page: responsive/container-size-queries
  since: 0.1.0

- id: container-shorthand
  level: 必須
  kind: convention
  rule: コンテナは `container` ショートハンドで、名前と種類をまとめて指定する（`container-type` を単体で書かない）。
  reason: 名前の付け忘れを防ぐため。
  page: responsive/container-size-queries
  since: 0.1.0

- id: container-query-inline-size
  level: 必須
  kind: convention
  rule: コンテナサイズクエリの条件では、`width` ではなく `inline-size` を使う。
  reason: 書字方向に依存しない、論理的な指定にそろえるため。
  aiProne: true
  page: responsive/container-size-queries
  since: 0.1.0

- id: hide-label-visually-in-container-query
  level: 推奨
  kind: spec
  rule: 'アイコンとラベルを並べた部品で、置かれた場所が狭いときにラベルを隠すなら、コンテナサイズクエリの中で `display: none` ではなく視覚的に隠す指定を書く。'
  reason: 'アイコンを `aria-hidden="true"` にしている場合、ラベルまで消すとリンクやボタンの名前がなくなるため。幅の違う複数の場所に置いても、修飾クラスなしで切り替えられる。'
  note: 隠し方は `.-visually-hidden` と同じ考え方です。ユーティリティのクラスはクエリの条件で付け外しできないので、同じ種類の指定をコンポーネントの中に書きます。
  page: responsive/container-size-queries
  since: 0.3.0

- id: container-query-screen-ratio
  level: 推奨
  kind: judgment
  rule: 要素が画面のどれだけを占めるかで見た目を変えるときは、`@container --scoped (inline-size >= 70svi)` のように、コンテナの幅をビューポート単位と比べる。
  reason: 折り返しのように、どの要素が画面の幅のほとんどを占めるかをブラウザが決める並びでも、要素ごとに判定でき、メディアクエリの閾値を置き場所ごとに持たなくて済むため。
  note: 境の割合は、切り替える2つの状態の割合の間に置き、その根拠をコメントに書きます。基準は親ではなく画面の幅なので、最大幅を決めて中央に寄せた領域の中では、広い画面ほど割合が下がります。ビューポート単位は `vw` ではなく `svi` で書きます（`no-vw-vh`）。
  page: responsive/container-size-queries
  since: 0.68.0

- id: zoom-as-last-resort
  level: 非推奨
  kind: judgment
  rule: '`zoom` による縮小は最後の手段にとどめ、使うときは、ルートの直下で中身を包む要素に `@container --scoped (inline-size < 最小幅)` の条件を付けて、`zoom: min(progress(100cqi, 0px, 最小幅), 1)` と書く。'
  reason: 文字も含めてすべてが縮小され、レイアウトの問題を解決せずに隠してしまうため。先にイントリンシックなレイアウトとコンテナサイズクエリで組み替え、それでも想定の最小幅を下回ると破綻するコンポーネントに限る。
  note: '`1` を上限にして、拡大には使いません。`progress()` に未対応の環境では縮小されないので、縮小しなくても読めて操作できる状態を保ちます（プログレッシブ・エンハンスメント）。文字サイズを縮める代わりにも使いません。'
  aiProne: true
  page: responsive/container-size-queries
  since: 0.1.0

# 13-4 コンテナの副作用とコンテナ単位
- id: no-container-just-in-case
  level: 非推奨
  kind: judgment
  rule: '`container` は、コンテナサイズクエリか `cqi` で実際に問い合わせる要素にだけ指定し、「とりあえず」すべてのルートや要素に付けない。'
  reason: 'コンテナにすると、インライン方向のサイズの封じ込めで幅が中身から決まらなくなり、`subgrid` も使えなくなるため。問い合わせないコンテナは、副作用だけを残す。'
  aiProne: true
  page: responsive/container-units-and-side-effects
  since: 0.20.0

- id: no-container-on-page-root
  level: 禁止
  kind: spec
  rule: '`html`、`body`、ページ全体のレイアウト要素をコンテナにしない。'
  reason: 'ページ全体の切り替えはメディアクエリの役割であり、古い実装では中にある `position: fixed` の要素が正しく配置されなくなるため。'
  page: responsive/container-units-and-side-effects
  since: 0.1.0

- id: no-container-on-intrinsic-size
  level: 禁止
  kind: spec
  rule: 幅が中身で決まる要素（インライン要素、`fit-content` の要素、`flex-basis` を指定していない flex アイテムなど）をコンテナにしない。
  reason: インライン方向のサイズの封じ込めが働き、幅が極端に小さく計算されるため。
  page: responsive/container-units-and-side-effects
  since: 0.1.0

- id: no-padding-on-container
  level: 非推奨
  kind: judgment
  rule: コンテナにする要素には `padding` や `border` を指定せず、レイアウトは子要素で行う。
  reason: コンテナの幅の計算がずれ、クエリの閾値や `cqi` の値が意図とずれるため。
  page: responsive/container-units-and-side-effects
  since: 0.1.0

- id: cqi-needs-named-container
  level: 必須
  kind: spec
  rule: '`cqi` は、名前付きのコンテナがあると言い切れる子孫の要素でだけ使う。'
  reason: 有効なコンテナがないと小さいビューポート単位（`svi`）として計算され、置き場所によって値の意味が変わるため。
  aiProne: true
  page: responsive/container-units-and-side-effects
  since: 0.1.0

- id: no-container-type-size
  level: 非推奨
  kind: judgment
  rule: '`container-type: size` と、それを前提にした `cqb`、`cqh`、`cqmin`、`cqmax` は使わない。'
  reason: コンテナの高さが確定していないと効かず、使える場面がほとんどないため。
  page: responsive/container-units-and-side-effects
  since: 0.1.0

- id: no-container-utility-class
  level: 禁止
  kind: convention
  rule: '`.container` のような汎用のクラスを作らない。`container` プロパティを持つ要素にだけ、`.sidebar-container` のように何のコンテナかが分かる名前を付ける。'
  reason: '`container` が CSS で意味を持つ語になったので、ただのラッパーに使うと誤解を招くため。'
  page: responsive/container-units-and-side-effects
  since: 0.1.0

# 13-5 メディアクエリ
- id: media-query-for-macro-layout
  level: 推奨
  kind: judgment
  rule: メディアクエリは、ページ全体の段組み、ビューポートに固定された要素、常に画面幅いっぱいに表示されるブロックに限って使う。
  reason: それ以外の要素は、イントリンシックな手法やコンテナサイズクエリのほうが置き場所の変化に強いため。
  page: responsive/media-queries
  since: 0.1.0

- id: query-range-syntax
  level: 必須
  kind: convention
  rule: メディアクエリとコンテナサイズクエリの条件は範囲構文（`>=` や `<`）で書き、`min-width` や `max-width` の書き方は使わない。
  reason: 条件を不等式として読め、境界の値を含むかどうかも明確になるため。
  lint: 'Stylelint: `media-feature-range-notation`（メディアクエリのみ）'
  aiProne: true
  page: responsive/media-queries
  since: 0.1.0

- id: mobile-first-queries
  level: 推奨
  kind: judgment
  rule: メディアクエリでは狭い画面向けのスタイルを基本に書き、広い画面で必要な差分だけを `width >=` の条件の中に書く。
  reason: 狭い画面のレイアウトのほうが単純なことが多く、打ち消すための指定が増えずに済むため。
  page: responsive/media-queries
  since: 0.1.0

- id: no-device-width-feature
  level: 禁止
  kind: spec
  rule: '`device-width`、`device-height`、`device-aspect-ratio` をメディアクエリの条件に使わない。幅は `width` で判定する。'
  reason: これらは端末の画面そのものの大きさを調べ、ウィンドウの幅や分割表示、ズームで変わる実際の表示領域を反映しないため。
  aiProne: true
  page: responsive/media-queries
  since: 0.4.0

- id: no-orientation-for-layout
  level: 非推奨
  kind: judgment
  rule: 'レイアウトの切り替えを `orientation` で判定しない。使える幅は `width` で判定する。'
  reason: '`orientation` が比べるのはビューポートの幅と高さで、端末の向きではないため。縦向きの端末でもソフトウェアキーボードが出るとビューポートが横長になり、`landscape` と判定されることがある。'
  page: responsive/media-queries
  since: 0.20.0

- id: any-pointer-not-width-for-input
  level: 推奨
  kind: spec
  rule: '操作の手段に合わせて変える指定は、画面の幅ではなく `@media (any-pointer: fine)` や `@media (any-pointer: coarse)` で判定する。'
  reason: 画面の幅と入力の手段は対応しないため。`pointer` は主な入力だけを調べるので、タブレットにマウスをつないだ場合のように、使える入力が複数ある環境の一方を取りこぼす。
  note: '`pointer` を使ってよいのは、主な入力の精度だけに合わせたいときに限る。ホバーの判定は `any-hover` を使う（第17章）。'
  aiProne: true
  page: responsive/media-queries
  since: 0.4.0

- id: prefers-contrast-more-for-faint-borders
  level: 推奨
  kind: judgment
  rule: '薄い境界線や補助テキストの色で区別や意味を伝えている部品は、`@media (prefers-contrast: more)` の中で色を濃くする。'
  reason: OS でコントラストを上げる設定にしているユーザーが、薄い区切りや補助テキストを読み取れる状態を保つため。
  note: '`prefers-contrast: custom` は強制カラーモードの配色に対応する値で、色は上書きされるため指定しない。強制カラーモードの扱いは第15章で説明する。'
  page: responsive/media-queries
  since: 0.4.0

- id: reduced-transparency-opaque-background
  level: 推奨
  kind: judgment
  rule: '半透明の背景や `backdrop-filter` の上に文字を置く部品は、`@media (prefers-reduced-transparency: reduce)` の中で背景を不透明にする。'
  reason: OS で透明度を下げる設定にしているユーザーが、背景に左右されずに文字を読める状態を保つため。
  note: 対応しているのは Chrome 系のブラウザだけです。半透明のままでもコントラストが足りる色を選んだうえで、追加の対策として書きます。
  page: responsive/media-queries
  since: 0.5.0

# 13-6 375px未満の画面で配置を保つ例外
- id: fixed-viewport-below-min-width
  level: 推奨
  kind: judgment
  rule: '375px 未満の画面でもカンプの配置を保つ要件があるときに限り、`<meta name="viewport">` の直後にインラインで置いたスクリプトで、`content` を `width=375` に書き換え、ビューポートの幅を固定する。要件がなければ固定せず、自然に折り返した表示にする。'
  reason: 固定すると、幅 320px の端末では 16px の本文が約 13.6px に縮小されるため。320 CSS px で崩れない CSS なら固定しなくても内容は読めるので、固定で得られるのはカンプに近い配置だけである。320 CSS px で内容が読めて操作できることは、スクリプトに頼らず CSS で保証する。
  note: '判定には `window.innerWidth` ではなく `window.outerWidth` を使います。`innerWidth` はビューポートを固定すると 375 になって元に戻れなくなります。ズームしたときの `outerWidth` はブラウザで違い、Chrome では変わりませんが、Firefox では小さくなります。`maximum-scale` や `user-scalable=no` は書き加えず、固定した後もズームできる状態を保ちます。外部ファイルにすると、読み込みを待つ間に狭いレイアウトで描画され、固定したときにレイアウトシフトが起きます。'
  aiProne: true
  page: responsive/min-viewport-width
  since: 0.18.0

# 13-7 カンプの幅で全体を拡大・縮小しない
- id: no-full-liquid-scaling
  level: 禁止
  kind: judgment
  rule: カンプの幅に対する比率で、ページ全体の文字サイズや余白を拡大・縮小しない（フルリキッドにしない）。
  reason: 1440px のカンプを幅 768px の画面に縮めると本文が約8.5px になるように、カンプの幅から離れるほど文字が読めなくなり、比率をビューポート単位から求めると文字サイズの設定やズームも効きにくくなるため。どの幅でも同じ配置を縮めるだけなので、画面に合わせて配置を変えるレスポンシブ対応にもならない。
  note: 'ブレイクポイントはデザインの段階で決めず、実装の段階でデザイナーと、保つもの（本文の読みやすさ、情報の量、画像の縦横比、CTA）と崩れとみなす基準（カラムの数を変える時点、余白を削る順番）をすり合わせて決めます（3-2）。コンポーネントの切り替えはコンテナサイズクエリで、ビューポートに密着する要素とページ全体の段組みはメディアクエリで書き、幅で連続的に変えたい値は値ごとに `clamp()` で範囲を決めます（6-3）。'
  aiProne: true
  page: responsive/design-comp-pattern
  since: 0.18.0

- id: local-liquid-with-cqi
  level: 推奨
  kind: judgment
  rule: ヒーローのように幅に合わせて拡大・縮小させたい局所は、その部分を名前付きのコンテナにして `cqi` で組み、ビューポート単位を使わない。
  reason: 置かれた場所の幅に合わせて振る舞い、ページのほかの部分の文字サイズや余白を巻き込まないため。
  note: '文字サイズは、最小値と最大値を rem にし、推奨値を `cqi` と rem の和にした `clamp()` で書きます（`clamp-rem-bounds`）。`cqi` を使うのは、コンテナの子孫の要素だけです（`cqi-needs-named-container`）。'
  aiProne: true
  page: responsive/design-comp-pattern
  since: 0.18.0

# 13-8 セーフエリアに対応する
- id: safe-area-inset-with-viewport-fit-cover
  level: 必須
  kind: spec
  rule: '`<meta name="viewport">` に `viewport-fit=cover` を指定したら、文字やボタンを `env(safe-area-inset-*)` で確保した範囲の内側に置き、上下左右と横向きの画面で確認する。'
  reason: '`cover` を指定するとブラウザはページをセーフエリアの内側に寄せなくなり、余白を書かないと、ノッチやホームインジケーターのある端末でだけ内容が隠れるため。'
  note: 画面の端まで描画する必要がないページでは、`viewport-fit` をデフォルトの `auto` のままにします。パソコンのブラウザではセーフエリアがすべて0なので、実機か iOS シミュレーターで確かめます。
  aiProne: true
  page: responsive/safe-area
  since: 0.5.0

- id: safe-area-combine-with-max
  level: 推奨
  kind: spec
  rule: 'セーフエリアの値は単独で余白にせず、左右のガターや端に接するバーの余白は `max(16px, env(safe-area-inset-left))` のように通常の余白と比べ、端から浮かせる要素の位置は `calc(16px + env(safe-area-inset-bottom))` のように足す。'
  reason: セーフエリアの値は切り欠きやシステムの UI が占める幅そのもので、長方形の画面では0になるため。比べるか足すかは、余白の一部をセーフエリアで兼ねてよいかで決まる。
  note: '`env()` の第2引数は、ブラウザがその名前の環境変数を知らないときだけ使われます。`env(safe-area-inset-bottom, 16px)` と書いても、セーフエリアのない画面では16pxではなく0になります。'
  aiProne: true
  page: responsive/safe-area
  since: 0.5.0

- id: safe-area-background-to-edge
  level: 推奨
  kind: spec
  rule: セーフエリアの余白は、背景を持つ要素の `padding` に入れ、背景は画面の端まで塗り、中身だけをセーフエリアの内側に寄せる。
  reason: '`viewport-fit=cover` を指定する目的は背景を端まで描くことで、`margin` や外側の要素の `padding` で空けると、背景が途切れた帯ができるため。'
  note: 'セクションの背景を端まで広げるなら、`body` ではなく、ページのレイアウトのガター（12-11 `primary-layout` など）にセーフエリアを入れます。'
  page: responsive/safe-area
  since: 0.5.0

- id: safe-area-fixed-bottom
  level: 必須
  kind: spec
  rule: '画面の下端に `position: fixed` で固定するバーやボタンには、`env(safe-area-inset-bottom)` を加える。'
  reason: ホームインジケーターと重なり、ボタンを押すつもりの操作でホーム画面に戻ってしまうため。
  note: 横向きの画面では左右にもセーフエリアがあるので、左右の端に接するバーやボタンには `env(safe-area-inset-left)` と `env(safe-area-inset-right)` も加えます。対象のブラウザはすべて `env()` に対応しているので、固定の値の宣言を前に書く二段構えのフォールバックは書きません。
  aiProne: true
  page: responsive/safe-area
  since: 0.5.0

# 13-9 収まらなくなったらナビゲーションを折りたたむ
- id: collapse-nav-on-overflow
  level: 推奨
  kind: judgment
  rule: 'ナビゲーションのように項目の数や文言が変わる横並びを、1行に収まらなくなったらメニューのボタンに切り替えるときは、各部の幅を足した閾値のクエリではなく、スクロールタイムラインで横並び自身の溢れを検知したフラグで切り替える。'
  reason: '切り替える幅が実際の中身から決まり、CMSで項目や文言が増えても、文字の大きさやフォントが変わっても、閾値を直さずに済むため。'
  note: 'ルートで `--_overflowing: --false` を宣言し、`timeline-scope` で受け取った横並びのスクロールタイムラインに、最初と最後で `--_overflowing: --true` にするアニメーションを結び付けます。横並びの列は `minmax(0, auto)` で縮められるようにし、両端の列は中身より縮めません。隠したナビゲーションと同じ項目を、ドロワーにも置きます。スクロール駆動アニメーションに対応していない環境では、フラグが常に `--true` になり、折りたたんだ表示になります。配置を組み替える切り替えには使わず、閾値を式で書きます（ルール `threshold-as-formula`）。'
  page: responsive/overflow-collapse
  since: 0.71.0

- id: hide-overflow-source-with-visibility
  level: 必須
  kind: spec
  rule: '溢れを検知して隠す要素は、`visibility: hidden` で隠し、`display: none` にしない。'
  reason: '`display: none` にすると溢れが消えてタイムラインが無効になり、フラグが戻って再び表示される切り替えを繰り返すため。'
  note: '`visibility: hidden` の要素は、レイアウトに場所を残したまま、フォーカスと支援技術からは外れます。スクロールバーが場所を取る環境で、溢れた瞬間に高さが変わらないように、溢れを測る要素には `scrollbar-width: none` も指定します。'
  aiProne: true
  page: responsive/overflow-collapse
  since: 0.71.0

# 13-10 流体的な値の区間をそろえる
- id: shared-fluid-range
  level: 推奨
  kind: judgment
  rule: '画面の幅で連続的に変える値（`svi` を使う `clamp()` など）の区間の端（変わり始める幅と変わり終える幅）は、サイト共通のトークンで持ち、値ごとに決めない。'
  reason: 文字サイズと余白が同じ幅で変わり始めて同じ幅で止まり、区間を変えるときの修正も1か所で済むため。
  note: 'トークンは単位のないpx相当の数値（`--fluid--min-width: 375` と `--fluid--max-width: 1280` など）で持ち、値ごとには最小値と最大値だけを決めて、傾きと切片を式で求めます（`clamp-from-slope-intercept`）。区間をずらす理由がある値は、宣言の前のコメントに理由を残します。コンテナの幅で変える値（`cqi`）は、置かれる場所によって幅が違うので対象外です。区間の中の位置を数値にする `progress()` は、Safari 18が対応していないので、単位のない数値が要る型スケールの比率にだけ使い、`@supports` の中でトークンにして、対応していない環境では区間の始まりの値にします。流体的な値が1つだけなら、トークンにしなくてもかまいません。'
  page: responsive/fluid-range
  since: 0.79.0
