<div class="scoped pseudo-target" data-demo-layout="compare">
  <section data-example="class">
    <h3><code>p:first-of-type</code></h3>
    <p>擬似クラスは、条件に当てはまる要素を選びます。この段落は、親の中で最初の段落なので、段落の箱全体に背景色が付きます。</p>
    <p>2つ目の段落は条件に当てはまらないので、スタイルが当たりません。</p>
  </section>
  <section data-example="element">
    <h3><code>p::first-line</code></h3>
    <p>擬似要素は、要素の一部を選びます。どちらの段落も、1行目だけに背景色が付きます。幅を変えると、背景色の付く範囲が変わります。</p>
    <p>2つ目の段落にも1行目があるので、同じように当たります。</p>
  </section>
</div>
