<div class="scoped compare-demo" data-demo-layout="stack">
  <section>
    <h2>grid（列が1つずつ減る）</h2>
    <ul
      class="grid"
      style="--grid--column-min-width: calc(200 / 16 * 1rem); --grid--column-max-count: 3; --grid--gap: calc(var(--spacing--sm) * 1px)"
    >
      <li>特徴1</li>
      <li>特徴2</li>
      <li>特徴3</li>
    </ul>
  </section>
  <section>
    <h2>switcher（3列から一気に1列になる）</h2>
    <ul
      class="switcher"
      style="--switcher--column-min-width: calc(200 / 16 * 1rem); --switcher--column-count: 3; --switcher--gap: calc(var(--spacing--sm) * 1px)"
    >
      <li>特徴1</li>
      <li>特徴2</li>
      <li>特徴3</li>
    </ul>
  </section>
</div>
