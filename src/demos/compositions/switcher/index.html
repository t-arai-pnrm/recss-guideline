<div class="scoped feature-section | stack" style="--stack--gap: calc(var(--spacing--lg) * 1px)">
  <div
    class="switcher"
    style="--switcher--column-count: 3; --switcher--column-min-width: calc(200 / 16 * 1rem); --switcher--gap: calc(var(--spacing--md) * 1px)"
  >
    <section class="stack" style="--stack--gap: calc(var(--spacing--xxs) * 1px)">
      <h2>設計</h2>
      <p>要件を整理し、ページの構成と部品の分け方を決めます。</p>
    </section>
    <section class="stack" style="--stack--gap: calc(var(--spacing--xxs) * 1px)">
      <h2>実装</h2>
      <p>決めた部品を、どの幅でも崩れない CSS で組み立てます。</p>
    </section>
    <section class="stack" style="--stack--gap: calc(var(--spacing--xxs) * 1px)">
      <h2>運用</h2>
      <p>公開後の更新でも、部品の組み合わせだけでページを増やせます。</p>
    </section>
  </div>
  <ul
    class="switcher"
    style="--switcher--column-count: 4; --switcher--column-min-width: calc(140 / 16 * 1rem); --switcher--gap: calc(var(--spacing--xs) * 1px)"
  >
    <li>1</li>
    <li>2</li>
    <li>3</li>
    <li>4</li>
    <li>5</li>
  </ul>
</div>
