<div class="scoped composition-demo | stack" style="--stack--gap: calc(var(--spacing--lg) * 1px)">
  <ul class="cluster" style="--cluster--gap: calc(var(--spacing--xxs) * 1px)">
    <li>CSS</li>
    <li>コンポジション</li>
    <li>カスタムプロパティ</li>
    <li>レイアウト</li>
    <li>デザイントークン</li>
    <li>ユーティリティ</li>
  </ul>
  <div
    class="switcher"
    style="--switcher--column-count: 3; --switcher--column-min-width: calc(160 / 16 * 1rem); --switcher--gap: calc(var(--spacing--sm) * 1px)"
  >
    <section class="stack" style="--stack--gap: calc(var(--spacing--xxs) * 1px)">
      <h2>stack</h2>
      <p>子要素を縦に積み、間隔をそろえます。</p>
    </section>
    <section class="stack" style="--stack--gap: calc(var(--spacing--xxs) * 1px)">
      <h2>cluster</h2>
      <p>子要素を横に並べ、入りきらなければ折り返します。</p>
    </section>
    <section class="stack" style="--stack--gap: calc(var(--spacing--xxs) * 1px)">
      <h2>switcher</h2>
      <p>幅が閾値を下回ると、3列から1列に切り替わります。</p>
    </section>
  </div>
</div>
